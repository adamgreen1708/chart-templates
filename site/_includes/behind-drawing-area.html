<section class="btb-demo btb-draw" id="btb-draw-area" aria-labelledby="btb-draw-area-title"><h3 id="btb-draw-area-title">How big should the circle be?</h3><p>Two illustrative values: 1 and <span id="btb-draw-second">4</span>.</p><div class="btb-hc-switch" role="group" aria-label="Circle sizing method"><button type="button" data-sizing="area" aria-pressed="true">Scale area</button><button type="button" data-sizing="radius" aria-pressed="false">Scale radius</button></div><svg class="btb-draw-shape" viewBox="0 0 340 245" role="img" aria-label="Illustrative comparison of two circles"><circle cx="55" cy="108" r="22" fill="#aab1b5"/><circle id="btb-draw-second-circle" cx="224" cy="108" r="44" fill="#1f8fa8"/><text x="55" y="112" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">1</text><text id="btb-draw-circle-value" x="224" y="112" text-anchor="middle" font-size="17" fill="white" font-weight="bold">4</text><text x="55" y="216" text-anchor="middle" font-size="11" fill="#555">Reference</text><text id="btb-draw-area-label" x="224" y="216" text-anchor="middle" font-size="12" fill="#555">Area: 4× reference</text><text x="170" y="237" font-size="11" fill="#555" text-anchor="middle">Illustrative geometry, not observed data</text></svg><div class="btb-dot-controls"><label for="btb-draw-multiple">Second value <output id="btb-draw-multiple-value">4</output></label><input id="btb-draw-multiple" type="range" min="1" max="4" step="1" value="4"></div><div class="btb-draw-multipliers"><div>Radius multiplier<strong id="btb-draw-radius-mult">2.00×</strong></div><div>Area multiplier<strong id="btb-draw-area-mult">4×</strong></div></div><p id="btb-draw-area-note" aria-live="polite">The circle's area correctly represents the relative value.</p><button type="button" class="btb-reset" id="btb-draw-area-reset">Reset example</button><noscript><p>For values 1 and 4, the radius doubles when the area is scaled correctly.</p></noscript></section>
