<section class="btb-demo btb-publish" aria-labelledby="btb-publish-glossary-title"><h3 id="btb-publish-glossary-title">Five words worth understanding</h3><dl class="btb-publish-glossary"><dt>Repository</dt><dd>Our project folder with a recorded history.</dd><dt>Branch</dt><dd>A separate working version.</dd><dt>Commit</dt><dd>A recorded change to our files.</dd><dt>Pull request</dt><dd>A proposal to incorporate changes.</dd><dt>Merge</dt><dd>Bringing the changes together.</dd></dl></section>
