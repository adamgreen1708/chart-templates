<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 482" role="img"><title>Asking for information.</title><rect width="480" height="482" fill="#f3f4f6"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="23" fill="#111" font-weight="700" text-anchor="start">Asking for information.</text><text x="24" y="60" font-family="Arial,sans-serif" font-size="15" fill="#555" font-weight="400" text-anchor="start">An API request and response.</text><rect x="32" y="82" width="416" height="82" rx="3" fill="#252d35" stroke="#252d35"/><text x="240" y="114" font-family="Arial,sans-serif" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">Our Python instructions</text><text x="240" y="140" font-family="Arial,sans-serif" font-size="16" fill="#ddd" font-weight="400" text-anchor="middle">Running in GitHub</text><path d="M115 164V249m-7 -7 7 7 7 -7" stroke="#156b7f" stroke-width="2" fill="none"/><path d="M365 249V164m-7 7 7 -7 7 7" stroke="#888" stroke-width="2" fill="none"/><text x="130" y="195" font-family="Arial,sans-serif" font-size="16" fill="#156b7f" font-weight="700" text-anchor="start">Request</text><text x="130" y="217" font-family="Arial,sans-serif" font-size="14" fill="#555" font-weight="400" text-anchor="start">2026–27 results</text><text x="350" y="195" font-family="Arial,sans-serif" font-size="16" fill="#555" font-weight="700" text-anchor="end">Response</text><text x="350" y="217" font-family="Arial,sans-serif" font-size="14" fill="#555" font-weight="400" text-anchor="end">JSON data</text><rect x="32" y="256" width="416" height="83" rx="3" fill="#fff" stroke="#ccc"/><text x="240" y="287" font-family="Arial,sans-serif" font-size="22" fill="#111" font-weight="700" text-anchor="middle">football-data.org</text><text x="240" y="313" font-family="Arial,sans-serif" font-size="16" fill="#555" font-weight="400" text-anchor="middle">External results service</text><rect x="32" y="361" width="416" height="64" rx="3" fill="#dce9ec" stroke="#ccc"/><text x="24