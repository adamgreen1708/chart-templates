<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 610" role="img"><title>A little more than a picture.</title><rect width="480" height="610" fill="#f3f4f6"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="23" fill="#111" font-weight="700" text-anchor="start">A little more than a picture.</text><text x="24" y="60" font-family="Arial,sans-serif" font-size="15" fill="#555" font-weight="400" text-anchor="start">What happens when you paint a pixel?</text><rect x="74" y="82" width="332" height="126" rx="3" fill="#e3e4e6"/><text x="240" y="107" font-family="Arial,sans-serif" font-size="15" fill="#555" font-weight="700" text-anchor="middle">01 · THE ACTION</text><rect x="202" y="120" width="37" height="37" fill="#fff" stroke="#bbb"/><rect x="240" y="120" width="37" height="37" fill="#fff" stroke="#bbb"/><rect x="202" y="158" width="37" height="37" fill="#fff" stroke="#bbb"/><rect x="240" y="158" width="37" height="37" fill="#fff" stroke="#bbb"/><path d="M218 136L232 164L237 152L249 149Z" fill="#111" stroke="#fff"/><path d="M240 214v22m-6 -6 6 6 6 -6" stroke="#888" stroke-width="2" fill="none"/><rect x="74" y="245" width="332" height="117" rx="3" fill="#252d35"/><text x="240" y="270" font-family="Arial,sans-serif" font-size="15" fill="#ccc" font-weight="700" text-anchor="middle">02 · THE INSTRUCTIONS</text><text x="240" y="297" font-family="Arial,sans-serif" font-size="16" fill="#fff" font-weight="400" text-anchor="middle">Identify the selected square</text><text x="240" y="319" font-family="Arial,sans-serif" font-size="16" fill="#fff" font-weight="400" text-anchor="middle">Update its colour value</text><text x="240" y="341" font-family="Arial,sans-serif" font-size="16" fill="#fff" font-weight="400" text-anchor="middle">Redraw the display</text><path d="M240 368v22m-6 -6 6 6 6 -6" stroke="#888" stroke-width="2" fill="none"/><rect x="74" y="399" width="332" height="125" rx="3" fill="#dce9ec"/><text x="240" y="424" font-family="Arial,sans-serif" font-size="15" fill="#156b7f" font-weight="700" text-anchor="middle">03 · THE RESPONSE</text><rect x="202" y="437" width="37" height="37" fill="#096ba6" stroke="#bbb"/><rect x="240" y="437" width="37" height="37" fill="#fff" stroke="#bbb"/><rect x="202" y="475" width="37" height="37" fill="#fff" stroke="#bbb"/><rect x="240" y="475" width="37" height="37" fill="#fff" stroke="#bbb"/><text x="240" y="548" font-family="Arial,sans-serif" font-size="15" fill="#555" font-weight="400" text-anchor="middle">All within your browser.</text><path d="M24 570H456" stroke="#d0d0d0"/><text x="24" y="595" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="start">Adam Green | coffeetableviz</text><text x="456" y="595" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="end">Behind the build</text></svg>