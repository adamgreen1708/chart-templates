<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" role="img"><title>Automate the routine.</title><rect width="480" height="540" fill="#f3f4f6"/><text x="24" y="30" font-family="Arial,sans-serif" font-size="12" fill="#555" font-weight="400" text-anchor="start">BEHIND THE BUILD / AUTOMATION</text><text x="24" y="65" font-family="Arial,sans-serif" font-size="26" fill="#111" font-weight="700" text-anchor="start">Automate the routine.</text><rect x="140" y="87" width="200" height="61" rx="4" fill="#252d35"/><text x="240" y="112" font-family="Arial,sans-serif" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">Schedule</text><text x="240" y="134" font-family="Arial,sans-serif" font-size="14" fill="#ddd" font-weight="400" text-anchor="middle">Time to do something</text><path d="M240 148V171" stroke="#888" stroke-width="2"/><rect x="140" y="171" width="200" height="61" rx="4" fill="#252d35"/><text x="240" y="196" font-family="Arial,sans-serif" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">Execute</text><text x="240" y="218" font-family="Arial,sans-serif" font-size="14" fill="#ddd" font-weight="400" text-anchor="middle">Follow the instructions</text><path d="M240 232V252" stroke="#888" stroke-width="2"/><path d="M240 252L345 303L240 354L135 303Z" fill="#dce9ec" stroke="#156b7f" stroke-width="1.5"/><text x="240" y="299" font-family="Arial,sans-serif" font-size="18" fill="#156b7f" font-weight="700" text-anchor="middle">Validate</text><text x="240" y="320" font-family="Arial,sans-serif" font-size="14" fill="#156b7f" font-weight="400" text-anchor="middle">Everything OK?</text><path d="M135 303H70V389" stroke="#c44e52" stroke-width="2" fill="none"/><path d="M345 303H410V389" stroke="#156b7f" stroke-width="2" fill="none"/><text x="90" y="290" font-family="Arial,sans-serif" font-size="14" fill="#a43138" font-weight="400" text-anchor="start">No</text><text x="385" y="290" font-family="Arial,sans-serif" font-size="14" fill="#156b7f" font-weight="400" text-anchor="start">Yes</text><rect x="24" y="389" width="201" height="84" rx="4" fill="#a43138"/><text x="124.5" y="418" font-family="Arial,sans-serif" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">Stop and investigate</text><text x="124.5" y="442" font-family="Arial,sans-serif" font-size="13" fill="#fff" font-weight="400" text-anchor="middle">Retain existing content</text><rect x="255" y="389" width="201" height="84" rx="4" fill="#156b7f"/><text x="355.5" y="418" font-family="Arial,sans-serif" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">Continue</text><text x="355.5" y="442" font-family="Arial,sans-serif" font-size="13" fill="#fff" font-weight="400" text-anchor="middle">Within approved rules</text><path d="M24 495H456" stroke="#d0d0d0"/><text x="24" y="520" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="start">Adam Green | coffeetableviz</text><text x="456" y="520" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="end">Behind the build</text></svg>