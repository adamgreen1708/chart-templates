<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 490" role="img"><title>Colour through layers.</title><rect width="480" height="490" fill="#f3f4f6"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="24" fill="#111111" font-weight="700" text-anchor="start">Colour through layers.</text><text x="24" y="59" font-family="Arial,sans-serif" font-size="15" fill="#555555" font-weight="400" text-anchor="start">Four ink screens, each with its own angle.</text><defs><pattern id="inkC" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(15)"><circle cx="6" cy="6" r="3.6" fill="#00A9E0"/></pattern><pattern id="inkM" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(75)"><circle cx="6" cy="6" r="3.6" fill="#EC008C"/></pattern><pattern id="inkY" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(0)"><circle cx="6" cy="6" r="3.6" fill="#FFDE00"/></pattern><pattern id="inkK" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)"><circle cx="6" cy="6" r="3.6" fill="#222222"/></pattern></defs><rect x="24" y="85" width="100" height="100" fill="#fff"/><rect x="24" y="85" width="100" height="100" fill="url(#inkC)" stroke="#d0d0d0"/><text x="74" y="208" font-family="Arial,sans-serif" font-size="16" fill="#111111" font-weight="700" text-anchor="middle">Cyan</text><text x="74" y="228" font-family="Arial,sans-serif" font-size="14" fill="#555555" font-weight="400" text-anchor="middle">15°</text><path d="M74 237V252H240" stroke="#888" fill="none"/><rect x="134" y="85" width="100" height="100" fill="#fff"/><rect x="134" y="85" width="100" height="100" fill="url(#inkM)" stroke="#d0d0d0"/><text x="184" y="208" font-family="Arial,sans-serif" font-size="16" fill="#111111" font-weight="700" text-anchor="middle">Magenta</text><text x="184" y="228" font-family="Arial,sans-serif" font-size="14" fill="#555555" font-weight="400" text-anchor="middle">75°</text><path d="M184 237V252H240" stroke="#888" fill="none"/><rect x="244" y="85" width="100" height="100" fill="#fff"/><rect x="244" y="85" width="100" height="100" fill="url(#inkY)" stroke="#d0d0d0"/><text x="294" y="208" font-family="Arial,sans-serif" font-size="16" fill="#111111" font-weight="700" text-anchor="middle">Yellow</text><text x="294" y="228" font-family="Arial,sans-serif" font-size="14" fill="#555555" font-weight="400" text-anchor="middle">0°</text><path d="M294 237V252H240" stroke="#888" fill="none"/><rect x="354" y="85" width="100" height="100" fill="#fff"/><rect x="354" y="85" width="100" height="100" fill="url(#inkK)" stroke="#d0d0d0"/><text x="404" y="208" font-family="Arial,sans-serif" font-size="16" fill="#111111" font-weight="700" text-anchor="middle">Black</text><text x="404" y="228" font-family="Arial,sans-serif" font-size="14" fill="#555555" font-weight="400" text-anchor="middle">45°</text><path d="M404 237V252H240" stroke="#888" fill="none"/><path d="M240 252v19m-6 -6 6 6 6 -6" stroke="#1f8fa8" stroke-width="2" fill="none"/><g style="isolation:isolate"><rect x="160" y="281" width="160" height="130" fill="#fff"/><rect x="160" y="281" width="160" height="130" fill="url(#inkC)" style="mix-blend-mode:multiply"/><rect x="160" y="281" width="160" height="130" fill="url(#inkM)" style="mix-blend-mode:multiply"/><rect x="160" y="281" width="160" height="130" fill="url(#inkY)" style="mix-blend-mode:multiply"/><rect x="160" y="281" width="160" height="130" fill="url(#inkK)" style="mix-blend-mode:multiply"/></g><text x="240" y="435" font-family="Arial,sans-serif" font-size="17" fill="#111111" font-weight="700" text-anchor="middle">Overlapping ink layers</text><path d="M24 450H456" stroke="#d0d0d0"/><text x="24" y="475" font-family="Arial,sans-serif" font-size="13" fill="#555555" font-weight="400" text-anchor="start">Adam Green | coffeetableviz</text><text x="456" y="475" font-family="Arial,sans-serif" font-size="13" fill="#555555" font-weight="400" text-anchor="end">Behind the build</text></svg>