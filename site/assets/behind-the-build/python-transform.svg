<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" role="img"><title>Data doesn't prepare itself.</title><rect width="480" height="540" fill="#f3f4f6"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="23" fill="#111" font-weight="700" text-anchor="start">Data doesn't prepare itself.</text><text x="24" y="60" font-family="Arial,sans-serif" font-size="15" fill="#555" font-weight="400" text-anchor="start">Python provides a repeatable set of instructions.</text><rect x="72" y="82" width="336" height="98" rx="3" fill="#e1e3e5"/><text x="240" y="106" font-family="Arial,sans-serif" font-size="14" fill="#555" font-weight="700" text-anchor="middle">INPUT · CSV</text><text x="240" y="140" font-family="Arial,sans-serif" font-size="31" fill="#111" font-weight="700" text-anchor="middle">380 fixtures</text><text x="240" y="163" font-family="Arial,sans-serif" font-size="15" fill="#555" font-weight="400" text-anchor="middle">One row per match</text><path d="M240 185v22m-6 -6 6 6 6 -6" stroke="#888" stroke-width="2" fill="none"/><rect x="72" y="216" width="336" height="132" rx="3" fill="#fff" stroke="#c8c8c8"/><rect x="72" y="216" width="336" height="36" fill="#252d35"/><text x="240" y="240" font-family="Arial,sans-serif" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">PYTHON INSTRUCTIONS</text><circle cx="102" cy="272" r="5" fill="#1f8fa8"/><text x="120" y="277" font-family="Arial,sans-serif" font-size="16" fill="#111" font-weight="400" text-anchor="start">Read and validate</text><circle cx="102" cy="299" r="5" fill="#1f8fa8"/><text x="120" y="304" font-family="Arial,sans-serif" font-size="16" fill="#111" font-weight="400" text-anchor="start">Restructure the records</text><circle cx="102" cy="326" r="5" fill="#1f8fa8"/><text x="120" y="331" font-family="Arial,sans-serif" font-size="16" fill="#111" font-weight="400" text-anchor="start">Calculate and check</text><path d="M240 354v22m-6 -6 6 6 6 -6" stroke="#888" stroke-width="2" fill="none"/><rect x="72" y="385" width="336" height="98" rx="3" fill="#dce9ec"/><text x="240" y="410" font-family="Arial,sans-serif" font-size="14" fill="#156b7f" font-weight="700" text-anchor="middle">OUTPUT · JSON</text><text x="240" y="443" font-family="Arial,sans-serif" font-size="31" fill="#111" font-weight="700" text-anchor="middle">760 records</text><text x="240" y="466" font-family="Arial,sans-serif" font-size="15" fill="#555" font-weight="400" text-anchor="middle">Two club perspectives per match</text><path d="M24 500H456" stroke="#d0d0d0"/><text x="24" y="525" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="start">Adam Green | coffeetableviz</text><text x="456" y="525" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="end">Behind the build</text></svg>