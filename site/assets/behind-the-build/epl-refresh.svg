<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 645" role="img"><title>Automated. But not unchecked.</title><rect width="480" height="645" fill="#f3f4f6"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="24" fill="#111111" font-weight="700" text-anchor="start">Automated. But not unchecked.</text><text x="24" y="60" font-family="Arial,sans-serif" font-size="15" fill="#555555" font-weight="400" text-anchor="start">The configured 2026–27 refresh process.</text><rect x="62" y="82" width="356" height="62" rx="3" fill="#fff" stroke="#ccc"/><text x="240" y="106" font-family="Arial,sans-serif" font-size="17" fill="#111111" font-weight="700" text-anchor="middle">Daily scheduled check</text><text x="240" y="127" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="middle">08:30 UK time</text><path d="M240 148v19m-6 -6 6 6 6 -6" stroke="#777" stroke-width="2" fill="none"/><rect x="62" y="174" width="356" height="62" rx="3" fill="#fff" stroke="#ccc"/><text x="240" y="198" font-family="Arial,sans-serif" font-size="17" fill="#111111" font-weight="700" text-anchor="middle">Retrieve completed results</text><text x="240" y="219" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="middle">football-data.org API</text><path d="M240 240v19m-6 -6 6 6 6 -6" stroke="#777" stroke-width="2" fill="none"/><rect x="62" y="266" width="356" height="62" rx="3" fill="#fff" stroke="#ccc"/><text x="240" y="290" font-family="Arial,sans-serif" font-size="17" fill="#111111" font-weight="700" text-anchor="middle">Validate and rebuild</text><text x="240" y="311" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="middle">Dates, scores, duplicates, history</text><path d="M240 332v19m-6 -6 6 6 6 -6" stroke="#777" stroke-width="2" fill="none"/><rect x="62" y="358" width="356" height="62" rx="3" fill="#fff" stroke="#ccc"/><text x="240" y="382" font-family="Arial,sans-serif" font-size="17" fill="#111111" font-weight="700" text-anchor="middle">New data? Test in browsers</text><text x="240" y="403" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="middle">Desktop and mobile · data-only PR</text><path d="M240 426V445H122V467M240 445H358V467" fill="none" stroke="#888" stroke-width="1.5"/><rect x="24" y="470" width="196" height="70" rx="3" fill="#fff" stroke="#ccc"/><text x="122" y="494" font-family="Arial,sans-serif" font-size="17" fill="#156b7f" font-weight="700" text-anchor="middle">Checks pass</text><text x="122" y="515" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="middle">Publish verified data</text><rect x="260" y="470" width="196" height="70" rx="3" fill="#fff" stroke="#ccc"/><text x="358" y="494" font-family="Arial,sans-serif" font-size="17" fill="#c44e52" font-weight="700" text-anchor="middle">Checks fail</text><text x="358" y="515" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="middle">Keep data; raise issue</text><text x="240" y="565" font-family="Arial,sans-serif" font-size="14" fill="#555" font-weight="400" text-anchor="middle">No new results? No data update.</text><text x="240" y="586" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="middle">Automatic merge: two allowed data files only.</text><path d="M24 605H456" stroke="#d0d0d0"/><text x="24" y="630" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="start">Adam Green | coffeetableviz</text><text x="456" y="630" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="end">Behind the build</text></svg>