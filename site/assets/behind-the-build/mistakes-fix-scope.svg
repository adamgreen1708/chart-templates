<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 366" role="img"><title>One chart or every chart?</title><rect width="480" height="366" fill="#f3f4f6"/><text x="24" y="34" font-family="Arial,sans-serif" font-size="24" fill="#111" font-weight="700" text-anchor="start">One chart or every chart?</text><rect x="125" y="55" width="230" height="66" rx="4" fill="#252d35"/><text x="240" y="80" font-family="Arial,sans-serif" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">Problem identified</text><text x="240" y="102" font-family="Arial,sans-serif" font-size="14" fill="#ddd" font-weight="400" text-anchor="middle">Could it happen again?</text><path d="M240 121V150H125V180M240 150H355V180" fill="none" stroke="#888" stroke-width="1.5"/><text x="125" y="173" font-family="Arial,sans-serif" font-size="12" fill="#555" font-weight="400" text-anchor="middle">Specific to this chart</text><text x="355" y="173" font-family="Arial,sans-serif" font-size="12" fill="#555" font-weight="400" text-anchor="middle">Reusable lesson</text><rect x="24" y="185" width="202" height="88" rx="4" fill="#fff" stroke="#bbb"/><text x="125" y="220" font-family="Arial,sans-serif" font-size="18" fill="#333" font-weight="700" text-anchor="middle">Configuration</text><text x="125" y="244" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="middle">Correct this chart</text><rect x="254" y="185" width="202" height="88" rx="4" fill="#156b7f"/><text x="355" y="220" font-family="Arial,sans-serif" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">Shared framework</text><text x="355" y="244" font-family="Arial,sans-serif" font-size="13" fill="#fff" font-weight="400" text-anchor="middle">Improve future charts</text><path d="M125 273V296H355V273M240 296V310" fill="none" stroke="#888" stroke-width="1.5"/><text x="240" y="334" font-family="Arial,sans-serif" font-size="18" fill="#333" font-weight="700" text-anchor="middle">Test the correction.</t