<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 514" role="img" aria-label="Trust is built into the process."><title>Trust is built into the process.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#7a7a7a"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#c44e52"/></marker></defs><rect x="0" y="0" width="480" height="514" rx="0" fill="#f3f4f6" stroke="none"/><text x="24" y="35" text-anchor="start" font-family="Arial,sans-serif" font-size="24" fill="#111111" font-weight="700">Trust is built into the process.</text><text x="24" y="59" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#555555" font-weight="400">Four checks before publication.</text><rect x="24" y="83" width="370" height="58" rx="5" fill="#e0eef1" stroke="none"/><text x="48" y="118" text-anchor="start" font-family="Arial,sans-serif" font-size="24" fill="#156b7f" font-weight="700">01</text><text x="102" y="106" text-anchor="start" font-family="Arial,sans-serif" font-size="19" fill="#111111" font-weight="700">Evidence</text><text x="102" y="127" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#555555" font-weight="400">Are the numbers correct?</text><path d="M209 141V154" fill="none" stroke="#7a7a7a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M394 112H435" stroke="#c44e52" stroke-width="2" stroke-dasharray="6 5"/><rect x="24" y="158" width="370" height="58" rx="5" fill="#e0eef1" stroke="none"/><text x="48" y="193" text-anchor="start" font-family="Arial,sans-serif" font-size="24" fill="#156b7f" font-weight="700">02</text><text x="102" y="181" text-anchor="start" font-family="Arial,sans-serif" font-size="19" fill="#111111" font-weight="700">Editorial</text><text x="102" y="202" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#555555" font-weight="400">Is the story worth telling?</text><path d="M209 216V229" fill="none" stroke="#7a7a7a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M394 187H435" stroke="#c44e52" stroke-width="2" stroke-dasharray="6 5"/><rect x="24" y="233" width="370" height="58" rx="5" fill="#e0eef1" stroke="none"/><text x="48" y="268" text-anchor="start" font-family="Arial,sans-serif" font-size="24" fill="#156b7f" font-weight="700">03</text><text x="102" y="256" text-anchor="start" font-family="Arial,sans-serif" font-size="19" fill="#111111" font-weight="700">Visual</text><text x="102" y="277" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#555555" font-weight="400">Is the chart clear and readable?</text><path d="M209 291V304" fill="none" stroke="#7a7a7a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M394 262H435" stroke="#c44e52" stroke-width="2" stroke-dasharray="6 5"/><rect x="24" y="308" width="370" height="58" rx="5" fill="#f0dcdd" stroke="none"/><text x="48" y="343" text-anchor="start" font-family="Arial,sans-serif" font-size="24" fill="#9b3539" font-weight="700">04</text><text x="102" y="331" text-anchor="start" font-family="Arial,sans-serif" font-size="19" fill="#111111" font-weight="700">Human</text><text x="102" y="352" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#555555" font-weight="400">Am I happy to publish it?</text><path d="M209 366V379" fill="none" stroke="#7a7a7a" stroke-width="2"  marker-end="url(#arrow)"/><path d="M394 337H435" stroke="#c44e52" stroke-width="2" stroke-dasharray="6 5"/><path d="M435 337V112H399" fill="none" stroke="#c44e52" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#red)"/><text x="447" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#111111" font-weight="400"></text><rect x="24" y="383" width="370" height="54" rx="5" fill="#156b7f" stroke="none"/><text x="209" y="406" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#ffffff" font-weight="700