<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 345" role="img" aria-label="Passing the tests isn't enough."><title>Passing the tests isn't enough.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#7a7a7a"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#c44e52"/></marker></defs><rect x="0" y="0" width="480" height="345" rx="0" fill="#f3f4f6" stroke="none"/><text x="24" y="35" text-anchor="start" font-family="Arial,sans-serif" font-size="24" fill="#111111" font-weight="700">Passing the tests isn't enough.</text><text x="24" y="59" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#555555" font-weight="400">Technical success is not editorial success.</text><text x="24" y="99" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#156b7f" font-weight="700">Technical checks</text><text x="248" y="99" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#9b3539" font-weight="700">Editorial questions</text><text x="24" y="129" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#111111" font-weight="400">✓  Data file exists</text><text x="24" y="159" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#111111" font-weight="400">✓  Code runs</text><text x="24" y="189" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#111111" font-weight="400">✓  Image created</text><text x="24" y="219" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#111111" font-weight="400">✓  Dimensions correct</text><text x="24" y="249" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#111111" font-weight="400">✓  Website builds</text><text x="248" y="129" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#111111" font-weight="400">?  Is it interesting?</text><text x="248" y="159" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#111111" font-weight="400">?  Is it misleading?</text><text x="248" y="189" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#111111" font-weight="400">?  Is it readable?</text><text x="248" y="219" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#111111" font-weight="400">?  Is the headline fair?</text><text x="248" y="249" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#111111" font-weight="400">?  Is it worth sharing?</text><text x="240" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#111111" font-weight="700">A successful build is not editorial approval.</text><path d="M24 306H456" stroke="#d0d0d0"/><text x="24" y="330" text-anchor="start" font-family="Arial,sans-serif" font-size="13" fill="#555555" font-weight="400">Adam Green | coffeetableviz</text><text x="456" y="330" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#555555" font-weight="400">Behind the build</text></svg>