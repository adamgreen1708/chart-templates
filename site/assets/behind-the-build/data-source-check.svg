<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img"><title>Every number has a history.</title><rect width="480" height="560" fill="#f3f4f6"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="23" fill="#111" font-weight="700" text-anchor="start">Every number has a history.</text><text x="24" y="60" font-family="Arial,sans-serif" font-size="15" fill="#555" font-weight="400" text-anchor="start">Accuracy starts before the first chart.</text><rect x="24" y="82" width="138" height="76" rx="3" fill="#fff" stroke="#ccc"/><text x="93" y="113" font-family="Arial,sans-serif" font-size="16" fill="#111" font-weight="700" text-anchor="middle">Published data</text><text x="93" y="137" font-family="Arial,sans-serif" font-size="14" fill="#555" font-weight="400" text-anchor="middle">CSV files</text><path d="M93 158V180H240V207" stroke="#888" stroke-width="2" fill="none"/><rect x="171" y="82" width="138" height="76" rx="3" fill="#fff" stroke="#ccc"/><text x="240" y="113" font-family="Arial,sans-serif" font-size="16" fill="#111" font-weight="700" text-anchor="middle">Data services</text><text x="240" y="137" font-family="Arial,sans-serif" font-size="14" fill="#555" font-weight="400" text-anchor="middle">APIs</text><path d="M240 158V180H240V207" stroke="#888" stroke-width="2" fill="none"/><rect x="318" y="82" width="138" height="76" rx="3" fill="#fff" stroke="#ccc"/><text x="387" y="113" font-family="Arial,sans-serif" font-size="16" fill="#111" font-weight="700" text-anchor="middle">Research</text><text x="387" y="137" font-family="Arial,sans-serif" font-size="14" fill="#555" font-weight="400" text-anchor="middle">Source records</text><path d="M387 158V180H240V207" stroke="#888" stroke-width="2" fill="none"/><rect x="72" y="214" width="336" height="140" rx="3" fill="#252d35" stroke="#252d35"/><text x="240" y="241" font-family="Arial,sans-serif" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">QUESTION THE SOURCE</text><circle cx="94" cy="263" r="3" fill="white"/><text x="105" y="268" font-family="Arial,sans-serif" font-size="15" fill="#fff" font-weight="400" text-anchor="start">Where did it originate?</text><circle cx="94" cy="285" r="3" fill="white"/><text x="105" y="290" font-family="Arial,sans-serif" font-size="15" fill="#fff" font-weight="400" text-anchor="start">What does it actually measure?</text><circle cx="94" cy="307" r="3" fill="white"/><text x="105" y="312" font-family="Arial,sans-serif" font-size="15" fill="#fff" font-weight="400" text-anchor="start">What's missing?</text><circle cx="94" cy="329" r="3" fill="white"/><text x="105" y="334" font-family="Arial,sans-serif" font-size="15" fill="#fff" font-weight="400" text-anchor="start">Can we use and reproduce it?</text><path d="M240 354V380H127V405M240 380H353V405" stroke="#888" stroke-width="2" fill="none"/><rect x="24" y="412" width="206" height="86" rx="3" fill="#dce9ec" stroke="#ccc"/><rect x="250" y="412" width="206" height="86" rx="3" fill="#ebdadb" stroke="#ccc"/><text x="127" y="443" font-family="Arial,sans-serif" font-size="18" fill="#156b7f" font-weight="700" text-anchor="middle">Suitable evidence</text><text x="127" y="471" font-family="Arial,sans-serif" font-size="15" fill="#333" font-weight="400" text-anchor="middle">Document and retain</text><text x="353" y="443" font-family="Arial,sans-serif" font-size="18" fill="#a43138" font-weight="700" text-anchor="middle">Unresolved issues</text><text x="353" y="471" font-family="Arial,sans-serif" font-size="15" fill="#333" font-weight="400" text-anchor="middle">Investigate or reject</text><path d="M24 520H456" stroke="#d0d0d0"/><text x="24" y="545" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="start">Adam Green | coffeetableviz</text><text x="456" y="545" font-family="Arial,sans-serif" font-size="13" fill="#555" font-weight="400" text-anchor="end">Behind the build</text></svg>