<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">One invisible line, many detours</title>
  <desc id="desc">A straight dashed latitude line runs across three abstract land shapes while a winding route repeatedly crosses it, ending at one muted-red marker.</desc>
  <rect width="1600" height="1600" fill="#F3F4F6"/>

  <!-- abstract land masses -->
  <path d="M145 505 C245 395 430 370 520 455 C585 520 560 640 470 705 C360 785 205 735 150 625 C125 575 125 535 145 505 Z" fill="#1B1B1B"/>
  <path d="M650 555 C715 470 845 450 940 505 C1015 550 1030 655 970 735 C900 825 765 830 685 760 C625 705 605 615 650 555 Z" fill="#3A3A3A"/>
  <path d="M1080 455 C1185 390 1375 405 1450 500 C1515 585 1480 705 1375 770 C1260 840 1110 800 1050 690 C1000 600 1010 500 1080 455 Z" fill="#1B1B1B"/>

  <!-- perfectly straight Tropic reference -->
  <line x1="90" y1="805" x2="1510" y2="805" stroke="#707070" stroke-width="18" stroke-dasharray="26 30" stroke-linecap="round"/>

  <!-- winding journey -->
  <path d="M135 715
           C230 640 300 875 395 820
           C470 775 500 665 565 705
           C645 755 665 890 755 845
           C835 805 855 675 945 730
           C1020 775 1030 900 1115 850
           C1190 805 1235 680 1315 735
           C1385 785 1400 865 1475 830"
        fill="none" stroke="#111111" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- route nodes -->
  <g fill="#111111">
    <circle cx="135" cy="715" r="23"/>
    <circle cx="395" cy="820" r="23"/>
    <circle cx="565" cy="705" r="23"/>
    <circle cx="755" cy="845" r="23"/>
    <circle cx="945" cy="730" r="23"/>
    <circle cx="1115" cy="850" r="23"/>
    <circle cx="1315" cy="735" r="23"/>
  </g>

  <!-- single house accent -->
  <circle cx="1475" cy="830" r="48" fill="#C44E52"/>

  <!-- small compass-like ticks, no text -->
  <g stroke="#555555" stroke-width="12" stroke-linecap="round" opacity="0.75">
    <line x1="250" y1="1040" x2="250" y2="1090"/>
    <line x1="235" y1="1065" x2="265" y2="1065"/>
    <line x1="805" y1="1035" x2="805" y2="1090"/>
    <line x1="790" y1="1062" x2="820" y2="1062"/>
    <line x1="1330" y1="1040" x2="1330" y2="1090"/>
    <line x1="1315" y1="1065" x2="1345" y2="1065"/>
  </g>
</svg>
