<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">Audio ribbon stretching beyond a stopwatch</title>
  <desc id="desc">Black-and-charcoal audio ribbon changing shape as it passes through and beyond a stopwatch on a light-grey background, with one muted-red timing mark.</desc>
  <rect width="1600" height="1600" fill="#F3F4F6"/>

  <!-- stopwatch crown -->
  <rect x="732" y="225" width="136" height="78" rx="18" fill="#111111"/>
  <rect x="775" y="165" width="50" height="72" rx="12" fill="#333333"/>
  <path d="M1000 334 L1062 272" stroke="#333333" stroke-width="34" stroke-linecap="round"/>
  <rect x="1032" y="236" width="64" height="42" rx="10" transform="rotate(-45 1064 257)" fill="#111111"/>

  <!-- stopwatch body -->
  <circle cx="800" cy="760" r="405" fill="none" stroke="#111111" stroke-width="48"/>
  <circle cx="800" cy="760" r="332" fill="none" stroke="#5A5A5A" stroke-width="8" stroke-dasharray="4 28" opacity="0.62"/>

  <!-- restrained timing marks -->
  <path d="M800 342 L800 395" stroke="#111111" stroke-width="22" stroke-linecap="round"/>
  <path d="M1217 760 L1164 760" stroke="#111111" stroke-width="22" stroke-linecap="round"/>
  <path d="M800 1178 L800 1125" stroke="#111111" stroke-width="22" stroke-linecap="round"/>
  <path d="M383 760 L436 760" stroke="#111111" stroke-width="22" stroke-linecap="round"/>

  <!-- single muted-red timing boundary -->
  <path d="M1094 465 L1139 421" stroke="#C44E52" stroke-width="42" stroke-linecap="round"/>

  <!-- minimalist hands -->
  <circle cx="800" cy="760" r="36" fill="#111111"/>
  <path d="M800 760 L800 515" stroke="#333333" stroke-width="24" stroke-linecap="round"/>
  <path d="M800 760 L963 678" stroke="#333333" stroke-width="24" stroke-linecap="round"/>

  <!-- audio ribbon: same path changes character through the clock -->
  <path d="M85 790
           C150 790 170 706 225 706
           C280 706 300 875 360 875
           C420 875 437 635 505 635
           C570 635 585 830 645 830
           C700 830 718 690 770 690
           C825 690 842 900 905 900
           C970 900 986 604 1050 604
           C1112 604 1136 822 1198 822
           C1262 822 1284 664 1340 664
           C1402 664 1415 780 1515 780"
        fill="none" stroke="#111111" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- charcoal segmentation to imply changing form/style -->
  <path d="M405 875 C420 875 437 635 505 635 C570 635 585 830 645 830"
        fill="none" stroke="#4A4A4A" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M907 899 C970 900 986 604 1050 604 C1112 604 1136 822 1198 822"
        fill="none" stroke="#555555" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- small waveform cuts / negative-space rhythm -->
  <g stroke="#F3F4F6" stroke-width="15" stroke-linecap="round" opacity="0.95">
    <path d="M188 742 L205 770"/>
    <path d="M313 786 L332 829"/>
    <path d="M475 690 L492 725"/>
    <path d="M606 774 L622 802"/>
    <path d="M744 724 L762 755"/>
    <path d="M875 827 L894 861"/>
    <path d="M1030 651 L1048 686"/>
    <path d="M1160 764 L1178 796"/>
    <path d="M1315 704 L1331 735"/>
    <path d="M1432 729 L1451 756"/>
  </g>

  <!-- understated trailing motion lines: ribbon continues beyond the rule -->
  <path d="M1362 575 C1435 545 1495 552 1550 582" fill="none" stroke="#555555" stroke-width="18" stroke-linecap="round" opacity="0.7"/>
  <path d="M1378 965 C1450 997 1502 985 1552 956" fill="none" stroke="#555555" stroke-width="18" stroke-linecap="round" opacity="0.7"/>
</svg>
