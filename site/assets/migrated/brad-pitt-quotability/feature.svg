<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
<title id="title">Fury started it. Tyler Durden owns the answer.</title>
<desc id="desc">Black-and-charcoal stencil illustration on a light-grey background showing a tank and a plain soap bar on opposite ends of a seesaw, with the soap side weighed down by quotation marks and one muted-red quote mark beside the tank.</desc>

<rect width="1600" height="1600" fill="#F3F4F6"/>

<!-- seesaw -->
<polygon points="155,950 1460,1115 1452,1148 150,983" fill="#111111"/>
<polygon points="765,1035 880,1300 650,1300" fill="#111111"/>

<!-- tank group -->
<g transform="rotate(7 440 900)" fill="#111111">
  <!-- tracks -->
  <rect x="170" y="785" width="500" height="150" rx="72"/>
  <rect x="205" y="812" width="430" height="96" rx="46" fill="#F3F4F6"/>
  <circle cx="270" cy="860" r="34"/>
  <circle cx="360" cy="860" r="34"/>
  <circle cx="450" cy="860" r="34"/>
  <circle cx="540" cy="860" r="34"/>
  <circle cx="610" cy="860" r="28"/>
  <!-- lower hull -->
  <polygon points="210,785 255,690 575,690 645,785"/>
  <!-- upper hull -->
  <polygon points="290,690 335,610 535,610 585,690"/>
  <!-- turret -->
  <rect x="350" y="540" width="190" height="92" rx="14"/>
  <rect x="405" y="490" width="72" height="55" rx="6"/>
  <!-- open commander hatch -->
  <rect x="416" y="438" width="78" height="18" rx="3" transform="rotate(-16 455 447)"/>
  <!-- gun barrel -->
  <rect x="510" y="562" width="285" height="22" rx="11"/>
  <rect x="770" y="556" width="48" height="34" rx="8"/>
</g>

<!-- red quote mark near Fury -->
<g fill="#C44E52" transform="translate(525 355)">
  <circle cx="0" cy="0" r="48"/>
  <polygon points="-12,28 20,28 2,78 -30,78"/>
</g>

<!-- soap bar -->
<g transform="rotate(7 1120 1000)">
  <rect x="1000" y="880" width="325" height="175" rx="34" fill="#111111"/>
  <rect x="1018" y="898" width="289" height="139" rx="26" fill="#F3F4F6"/>
  <path d="M1038 930 Q1160 885 1288 928" fill="none" stroke="#111111" stroke-width="16" stroke-linecap="round"/>
</g>

<!-- quote shapes weighing down the soap -->
<g fill="#111111">
  <g transform="translate(960 720) scale(1.15)">
    <circle cx="0" cy="0" r="52"/><polygon points="-12,30 22,30 2,86 -34,86"/>
  </g>
  <g transform="translate(1110 650) scale(1.45)">
    <circle cx="0" cy="0" r="52"/><polygon points="-12,30 22,30 2,86 -34,86"/>
  </g>
  <g transform="translate(1265 720) scale(1.05)">
    <circle cx="0" cy="0" r="52"/><polygon points="-12,30 22,30 2,86 -34,86"/>
  </g>
  <g transform="translate(1375 805) scale(.85)">
    <circle cx="0" cy="0" r="52"/><polygon points="-12,30 22,30 2,86 -34,86"/>
  </g>
  <g transform="translate(930 880) scale(.8)">
    <circle cx="0" cy="0" r="52"/><polygon points="-12,30 22,30 2,86 -34,86"/>
  </g>
  <g transform="translate(1370 960) scale(.7)">
    <circle cx="0" cy="0" r="52"/><polygon points="-12,30 22,30 2,86 -34,86"/>
  </g>
</g>

<!-- grounding texture -->
<g fill="#111111" opacity=".22">
  <rect x="205" y="1310" width="1170" height="8" rx="4"/>
  <rect x="285" y="1334" width="1010" height="5" rx="3"/>
  <rect x="390" y="1354" width="800" height="3" rx="2"/>
</g>
</svg>