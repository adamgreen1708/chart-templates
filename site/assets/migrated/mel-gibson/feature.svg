<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
<title id="title">Mel Gibson career changed shape</title>
<desc id="desc">Black-and-charcoal editorial illustration on a light-grey background showing one film strip splitting at a muted-red hinge into a broken-then-busier acting lane and a thinner directing lane with six widely spaced markers and a small director's-chair symbol.</desc>

<rect width="1600" height="1600" fill="#F3F4F6"/>

<!-- incoming movie-star lane -->
<g>
  <path d="M120 760 C330 700 540 710 790 790" fill="none" stroke="#111111" stroke-width="150" stroke-linecap="round"/>
  <path d="M135 760 C340 705 545 716 775 790" fill="none" stroke="#F3F4F6" stroke-width="78" stroke-linecap="round"/>
  <g fill="#111111">
    <rect x="165" y="711" width="70" height="26" rx="5" transform="rotate(-12 200 724)"/>
    <rect x="270" y="689" width="70" height="26" rx="5" transform="rotate(-8 305 702)"/>
    <rect x="380" y="681" width="70" height="26" rx="5" transform="rotate(-3 415 694)"/>
    <rect x="490" y="687" width="70" height="26" rx="5" transform="rotate(3 525 700)"/>
    <rect x="600" y="707" width="70" height="26" rx="5" transform="rotate(8 635 720)"/>
    <rect x="690" y="737" width="64" height="25" rx="5" transform="rotate(13 722 750)"/>
    <rect x="165" y="790" width="70" height="26" rx="5" transform="rotate(-12 200 803)"/>
    <rect x="270" y="769" width="70" height="26" rx="5" transform="rotate(-8 305 782)"/>
    <rect x="380" y="761" width="70" height="26" rx="5" transform="rotate(-3 415 774)"/>
    <rect x="490" y="767" width="70" height="26" rx="5" transform="rotate(3 525 780)"/>
    <rect x="600" y="787" width="70" height="26" rx="5" transform="rotate(8 635 800)"/>
    <rect x="690" y="817" width="64" height="25" rx="5" transform="rotate(13 722 830)"/>
  </g>
</g>

<!-- central hinge -->
<circle cx="805" cy="805" r="92" fill="#F3F4F6"/>
<circle cx="805" cy="805" r="62" fill="#C44E52"/>

<!-- acting lane, first post-hinge segment -->
<g>
  <path d="M860 870 C930 930 995 972 1060 1005" fill="none" stroke="#111111" stroke-width="142" stroke-linecap="round"/>
  <path d="M875 870 C938 926 995 963 1050 992" fill="none" stroke="#F3F4F6" stroke-width="72" stroke-linecap="round"/>
  <g fill="#111111">
    <rect x="895" y="878" width="58" height="24" rx="4" transform="rotate(38 924 890)"/>
    <rect x="964" y="931" width="58" height="24" rx="4" transform="rotate(31 993 943)"/>
    <rect x="897" y="942" width="58" height="24" rx="4" transform="rotate(38 926 954)"/>
    <rect x="967" y="993" width="58" height="24" rx="4" transform="rotate(31 996 1005)"/>
  </g>
</g>

<!-- visible acting gap -->
<g stroke="#7A7A7A" stroke-width="10" stroke-linecap="round" opacity=".65">
  <line x1="1088" y1="1024" x2="1118" y2="1042"/>
  <line x1="1100" y1="1006" x2="1130" y2="1024"/>
  <line x1="1112" y1="988" x2="1142" y2="1006"/>
</g>

<!-- acting lane resumes busier -->
<g>
  <path d="M1165 1075 C1275 1135 1370 1180 1490 1215" fill="none" stroke="#111111" stroke-width="152" stroke-linecap="round"/>
  <path d="M1180 1075 C1285 1128 1377 1168 1478 1198" fill="none" stroke="#F3F4F6" stroke-width="80" stroke-linecap="round"/>
  <g fill="#111111">
    <rect x="1195" y="1053" width="52" height="22" rx="4" transform="rotate(28 1221 1064)"/>
    <rect x="1252" y="1084" width="52" height="22" rx="4" transform="rotate(25 1278 1095)"/>
    <rect x="1311" y="1111" width="52" height="22" rx="4" transform="rotate(22 1337 1122)"/>
    <rect x="1370" y="1135" width="52" height="22" rx="4" transform="rotate(19 1396 1146)"/>
    <rect x="1427" y="1155" width="45" height="21" rx="4" transform="rotate(17 1449 1165)"/>
    <rect x="1190" y="1122" width="52" height="22" rx="4" transform="rotate(28 1216 1133)"/>
    <rect x="1248" y="1152" width="52" height="22" rx="4" transform="rotate(25 1274 1163)"/>
    <rect x="1307" y="1178" width="52" height="22" rx="4" transform="rotate(22 1333 1189)"/>
    <rect x="1365" y="1201" width="52" height="22" rx="4" transform="rotate(19 1391 1212)"/>
    <rect x="1422" y="1220" width="45" height="21" rx="4" transform="rotate(17 1444 1230)"/>
  </g>
</g>

<!-- sparse directing lane -->
<path d="M835 750 C990 615 1135 505 1390 410" fill="none" stroke="#2A2A2A" stroke-width="34" stroke-linecap="round"/>

<!-- exactly six directing markers -->
<g fill="#111111">
  <rect x="900" y="660" width="62" height="62" rx="8" transform="rotate(-31 931 691)"/>
  <rect x="990" y="589" width="62" height="62" rx="8" transform="rotate(-27 1021 620)"/>
  <rect x="1085" y="527" width="62" height="62" rx="8" transform="rotate(-23 1116 558)"/>
  <rect x="1180" y="473" width="62" height="62" rx="8" transform="rotate(-19 1211 504)"/>
  <rect x="1275" y="428" width="62" height="62" rx="8" transform="rotate(-15 1306 459)"/>
  <rect x="1365" y="393" width="62" height="62" rx="8" transform="rotate(-12 1396 424)"/>
</g>

<!-- minimal director chair -->
<g transform="translate(1190 185)" fill="#111111">
  <rect x="135" y="90" width="230" height="90" rx="8"/>
  <rect x="160" y="200" width="18" height="210"/>
  <rect x="322" y="200" width="18" height="210"/>
  <rect x="120" y="190" width="260" height="18" rx="8"/>
  <polygon points="165,410 195,410 300,560 270,560"/>
  <polygon points="335,410 305,410 200,560 230,560"/>
  <rect x="105" y="560" width="310" height="20" rx="10"/>
</g>

<!-- subtle ground texture -->
<g fill="#111111" opacity=".14">
  <rect x="230" y="1340" width="1120" height="8" rx="4"/>
  <rect x="330" y="1368" width="920" height="5" rx="3"/>
  <rect x="470" y="1392" width="640" height="3" rx="2"/>
</g>
</svg>