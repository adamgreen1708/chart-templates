name: Superhero creative art-direction phone QA (draft only)

on:
  push:
    branches:
      - "draft/2026-11-superhero-art-direction"
    paths:
      - ".github/workflows/qa-superhero-colour-v3.yml"

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install libraries for data verification and pixel QA
        run: |
          python -m pip install -r requirements-render.txt
          python -m pip install pytest pillow
      - name: Rebuild chart views from 24 source character observations
        run: python archive/projects/2026-11-superhero-colour-code/scripts/build_chart_views.py
      - name: Verify V2/V3 data consistency and config contract
        run: python -m pytest tests/test_palette_story_v3.py -q
      - name: Check exported 1600px PNGs and create 320px/390px previews
        run: python archive/projects/2026-11-superhero-colour-code/scripts/qa_palette_v3.py
      - uses: actions/upload-artifact@v4
        with:
          name: superhero-comic-v3-mobile-review
          path: archive/projects/2026-11-superhero-colour-code/output/qa_v3/*.png
          if-no-files-found: error
      - name: Commit proof copies for editorial review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+adamgreen1708@users.noreply.github.com"
          git add archive/projects/2026-11-superhero-colour-code/output/qa_v3
          git diff --staged --quiet || git commit -m "Archive comic v3 320px and 390px proof exports"
          git push
