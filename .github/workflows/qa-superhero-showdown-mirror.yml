name: Verify mirrored superhero showdown swatches (draft)
on:
  push:
    branches:
      - "draft/2026-11-superhero-art-direction"
    paths:
      - ".github/workflows/qa-superhero-showdown-mirror.yml"
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: |
          pip install -r requirements-render.txt
          pip install pytest pillow
      - name: Regenerate source datasets and test V3 contracts
        run: |
          python archive/projects/2026-11-superhero-colour-code/scripts/build_chart_views.py
          python -m pytest tests/test_palette_story_v3.py -q
      - name: Validate latest 1600px exports and make 320px/390px review images
        run: python archive/projects/2026-11-superhero-colour-code/scripts/qa_palette_v3.py
      - name: Commit updated mobile previews for user review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/projects/2026-11-superhero-colour-code/output/qa_v3/
          git diff --staged --quiet || git commit -m "Refresh phone previews for symmetric villain secondary chips"
          git push
