name: Build Bowie five-album audio profiles

on:
  push:
    branches:
      - project/2026-09-david-bowie-five-album-audio-features
    paths:
      - archive/projects/2026-09-david-bowie-five-album-audio-features/data/five_album_track_spine.csv
      - archive/projects/2026-09-david-bowie-five-album-audio-features/scripts/enrich_five_album_audio_features.py
      - archive/projects/2026-09-david-bowie-five-album-audio-features/scripts/render_five_album_audio_profiles.py
      - .github/workflows/build-bowie-ziggy-audio-profile.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 matplotlib numpy

      - name: Enrich five albums with ReccoBeats audio features
        run: python archive/projects/2026-09-david-bowie-five-album-audio-features/scripts/enrich_five_album_audio_features.py

      - name: QA enriched dataset
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path
          p=Path("archive/projects/2026-09-david-bowie-five-album-audio-features/data/five_album_audio_features.csv")
          rows=list(csv.DictReader(p.open(encoding="utf-8")))
          if len(rows)!=53:
              raise SystemExit(f"Expected 53 rows, got {len(rows)}")
          totals=Counter(r["album_title"] for r in rows)
          matched=Counter(r["album_title"] for r in rows if r["reccobeats_match_status"]=="matched")
          for album,total in sorted(totals.items()):
              print(f"QA {album}: {matched[album]}/{total}")
              if matched[album]/total < 0.80:
                  raise SystemExit(f"Coverage below 80% for {album}")
          for r in rows:
              if r["reccobeats_match_status"]!="matched":
                  continue
              for f in ["tempo","energy","valence","acousticness"]:
                  if r[f]=="":
                      raise SystemExit(f"Missing {f} for {r['album_title']} / {r['track_title']}")
          PY

      - name: Render all five album profiles
        run: python archive/projects/2026-09-david-bowie-five-album-audio-features/scripts/render_five_album_audio_profiles.py

      - name: Commit enriched data and chart outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             archive/projects/2026-09-david-bowie-five-album-audio-features/data/five_album_audio_features.csv             archive/projects/2026-09-david-bowie-five-album-audio-features/output/*_audio_profile.png
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Build Bowie five-album audio profiles"
            git push
          fi
