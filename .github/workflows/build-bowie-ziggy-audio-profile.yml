name: Build Bowie Ziggy audio profile prototype

on:
  push:
    branches:
      - project/2026-09-david-bowie-five-album-audio-features
    paths:
      - archive/projects/2026-09-david-bowie-five-album-audio-features/data/five_album_track_spine.csv
      - archive/projects/2026-09-david-bowie-five-album-audio-features/scripts/enrich_ziggy_audio_features.py
      - archive/projects/2026-09-david-bowie-five-album-audio-features/scripts/render_ziggy_audio_profile.py
      - .github/workflows/build-bowie-ziggy-audio-profile.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 matplotlib numpy

      - name: Enrich Ziggy tracks with ReccoBeats audio features
        run: python archive/projects/2026-09-david-bowie-five-album-audio-features/scripts/enrich_ziggy_audio_features.py

      - name: QA enriched dataset
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path("archive/projects/2026-09-david-bowie-five-album-audio-features/data/ziggy_audio_features.csv")
          rows=list(csv.DictReader(p.open(encoding="utf-8")))
          matched=[r for r in rows if r["reccobeats_match_status"]=="matched"]
          print(f"QA rows={len(rows)} matched={len(matched)}")
          if len(rows)!=11:
              raise SystemExit(f"Expected 11 Ziggy rows, got {len(rows)}")
          if len(matched)<10:
              raise SystemExit(f"Need at least 10 matched tracks, got {len(matched)}")
          for r in matched:
              if not r["tempo"] or not r["energy"] or not r["valence"] or not r["danceability"]:
                  raise SystemExit(f"Missing core audio features for {r['track_title']}")
          PY

      - name: Render Ziggy prototype
        run: python archive/projects/2026-09-david-bowie-five-album-audio-features/scripts/render_ziggy_audio_profile.py

      - name: Commit prototype outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             archive/projects/2026-09-david-bowie-five-album-audio-features/data/ziggy_audio_features.csv             archive/projects/2026-09-david-bowie-five-album-audio-features/output/ziggy_audio_profile.png
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Build Ziggy audio feature prototype"
            git push
          fi
