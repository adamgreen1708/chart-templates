name: Icons 07 — render review graphics (temporary)
on:
  push:
    branches:
      - icons-of-data-07-hawkins-20261020
    paths:
      - ".github/workflows/icons-07-render-review.yml"
      - "archive/projects/2026-10-icons-of-data/editions/07-hawkins/scripts/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned graphics dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.1.3 matplotlib==3.9.2 pillow==11.0.0
      - name: Produce three Icons of Data review graphics
        run: python archive/projects/2026-10-icons-of-data/editions/07-hawkins/scripts/render_hawkins_review.py
      - name: Validate finished images and manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,json,csv
          root=Path("archive/projects/2026-10-icons-of-data/editions/07-hawkins")
          m=json.loads((root/"qa/render_manifest.json").read_text())
          assert m["observations"]==176 and m["end_year"]==2025 and m["year_2026_excluded"] is True
          assert abs(m["reference_1961_2010_offset_C"]-0.18100777836)<1e-9
          for n,fn in [("01","01_the_original_warming_stripes.png"),("02","02_the_century_shifts_colour.png"),("03","03_decode_the_icon.png")]:
              p=root/"qa/visuals"/fn
              assert p.is_file()
              with Image.open(p) as im:
                  assert im.size==(1920,1920) and im.mode in ("RGB","RGBA")
                  # Confirm image isn't a blank canvas.
                  assert len(im.convert("RGB").resize((32,32)).getcolors(1024) or [])>30
              assert hashlib.sha256(p.read_bytes()).hexdigest()==m["figures"][n]["sha256"]
              for size in (320,390,600):
                  t=p.with_name(p.stem+f"_preview_{size}.png")
                  with Image.open(t) as im: assert im.size==(size,size)
          assert (root/"qa/visuals/01_reading_global_2020_original_unmodified.jpg").stat().st_size>15000
          print("PASS: PNG sizes, distinct image content, source-derived counts, previews, integrity hashes")
          PY
      - name: Upload author review artefacts
        uses: actions/upload-artifact@v4
        with:
          name: icons-07-github-render-review
          path: |
            archive/projects/2026-10-icons-of-data/editions/07-hawkins/qa/visuals/**
            archive/projects/2026-10-icons-of-data/editions/07-hawkins/qa/render_manifest.json
          if-no-files-found: error
      - name: Commit exact GitHub-rendered review images to draft branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/projects/2026-10-icons-of-data/editions/07-hawkins/qa/
          if git diff --cached --quiet; then echo "No new image bytes"; exit 0; fi
          git commit -m "Render Icons of Data 07 image-review files in GitHub Actions"
          git push origin HEAD:icons-of-data-07-hawkins-20261020
