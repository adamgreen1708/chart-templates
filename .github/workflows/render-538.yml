name: Render 538 chart

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib

      - name: Clear output folder
        run: |
          rm -rf output
          mkdir -p output

      - name: Run renderer
        run: python src/render_538.py

      - name: List output files
        run: |
          echo "Output folder contents:"
          ls -lah output || true

      - name: Upload PNG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-chart
          path: output/*.png

      - name: Commit rendered PNG back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/*.png
          git diff --staged --quiet || git commit -m "Render chart output"
          git push