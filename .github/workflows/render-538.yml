name: Render 538 chart

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib
      
      - name: Create derived snooker datasets
        run: python scripts/create_snooker_derived_files.py
      
      - name: Build filtered quadrant dataset
        run: python scripts/build_quadrants.py

      - name: Add fuel calculation column
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path("data/fuel_prices_trimmed_correct_pct_clean.csv")

          if path.exists():
              df = pd.read_csv(path)

              if {
                  "Diesel_pct_change_y",
                  "Gasoline_pct_change_y"
              }.issubset(df.columns):
                  df["Diesel_pct_change_minus_gasoline_pct_change"] = (
                      df["Diesel_pct_change_y"] - df["Gasoline_pct_change_y"]
                  )
                  df.to_csv(path, index=False)
                  print("Fuel calculation column added.")
              else:
                  print("Fuel pct change columns not found; skipping calculation.")
          else:
              print("Fuel dataset not found; skipping calculation.")
          PY

      - name: Clear output folder
        run: |
          rm -rf output
          mkdir -p output

      - name: Run renderer
        run: python src/render_538.py

      - name: List output files
        run: |
          echo "Output folder contents:"
          ls -lah output || true

      - name: Upload PNG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-chart
          path: output/*.png

      - name: Commit rendered output back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output
          git add data/fuel_prices_low_low_quadrant.csv
          git add data/fuel_prices_trimmed_correct_pct_clean.csv || true
          git diff --staged --quiet || git commit -m "Render chart output"
          git push