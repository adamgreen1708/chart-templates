name: Validate qualitative superhero story before final approval
on:
  push:
    branches:
      - "publish/2026-11-superhero-colour-story"
    paths:
      - ".github/workflows/qa-superhero-qualitative-release.yml"
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Test approved asset hashes, 24-person table, Jekyll flag and qualitative caveats
        run: python -m pytest tests/test_superhero_publication_staging.py -q
      - name: Build enabled Jekyll article
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - name: Validate actual compiled article and same data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          site=Path("_site")
          page=site/"stories/who-wears-the-hero-colours/index.html"
          assert page.is_file(),f"Missing actual Jekyll page: {page}"
          text=page.read_text(encoding="utf-8")
          for required in (
              "Who wears the hero colours?",
              "Good colours. Bad intentions.",
              "Same paint. Different morals.",
              "curated, qualitative exploration",
              "The Flash",
              "Magneto",
              "Sinestro",
              "Thanos",
              "Culture",
              "not an objectively measured costume-colour study",
          ):
              assert required in text,required
          assert text.count("<table")>=1,"Cast table not rendered as HTML"
          assert len(re.findall(r"<tr\b",text))>=13,"Expected one header and 12 compact cast rows"
          assert text.count("<figure")>=3,"Expected feature + two inline story charts"
          for name in (
              "superhero_v3_01_comic_lineup.png",
              "superhero_v3_02_colour_wheels.png",
              "superhero_v3_03_showdowns.png",
          ):
              assert name in text,name
              assert (site/"assets/charts/superhero-colour-code"/name).is_file(),name
          print("PASS: actual enabled Jekyll page, images, table and qualitative caveats")
          PY
