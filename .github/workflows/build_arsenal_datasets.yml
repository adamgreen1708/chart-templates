name: Build Arsenal datasets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arsenal-datasets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Build Arsenal story datasets
        run: |
          python scripts/build_arsenal_story_datasets.py

      - name: Show generated files
        run: |
          echo "Data folder:"
          ls -la data
          echo ""
          echo "Arsenal vs contenders:"
          cat data/arsenal_vs_contenders.csv
          echo ""
          echo "Goals against:"
          cat data/goals_against_by_team.csv
          echo ""
          echo "Monthly form:"
          cat data/arsenal_monthly_form.csv

      - name: Commit generated datasets
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/arsenal_vs_contenders.csv
          git add data/goals_against_by_team.csv
          git add data/arsenal_monthly_form.csv

          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "Generate Arsenal story datasets"
            git push
          fi