name: Build Arsenal datasets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arsenal-datasets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Build Arsenal rivals dataset
        run: |
          python scripts/build_arsenal_rivals_results.py

      - name: Show generated files
        run: |
          echo "Data folder:"
          ls -la data
          echo ""
          echo "Arsenal rivals results:"
          cat data/arsenal_rivals_results.csv

      - name: Commit generated dataset
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/arsenal_rivals_results.csv

          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "Generate Arsenal rivals dataset"
            git push
          fi