name: Build Arsenal datasets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-datasets:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Build Arsenal rivals dataset
        run: |
          python scripts/build_arsenal_rivals_results.py

      - name: Build goals against dataset
        run: |
          python scripts/build_goals_against_by_team.py

      - name: Show generated files
        run: |
          echo "=============================="
          echo "DATA FOLDER"
          echo "=============================="
          ls -la data

          echo ""
          echo "=============================="
          echo "ARSENAL RIVALS"
          echo "=============================="
          cat data/arsenal_rivals_results.csv

          echo ""
          echo "=============================="
          echo "GOALS AGAINST"
          echo "=============================="
          cat data/goals_against_by_team.csv

      - name: Commit generated datasets
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/arsenal_rivals_results.csv
          git add data/goals_against_by_team.csv

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Generate Arsenal datasets"
            git push
          fi