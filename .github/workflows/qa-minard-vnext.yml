name: QA Minard house-vNext (review only)

on:
  pull_request:
    paths:
      - "src/editorial_minard.py"
      - "src/editorial_schematics.py"
      - "archive/projects/2026-10-icons-of-data/review/config_minard_vnext.py"
      - "tests/test_minard_vnext.py"
      - ".github/workflows/qa-minard-vnext.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minard-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install renderer and QA dependencies
        run: |
          python -m pip install -r requirements-render.txt
          python -m pip install pytest pillow
      - name: Validate pinned Minard data and house profile
        run: python -m pytest tests/test_minard_vnext.py tests/test_social_profile.py -q
      - name: Render from GitHub CHART_CONFIG
        run: |
          cp archive/projects/2026-10-icons-of-data/review/config_minard_vnext.py src/chart_config.py
          python src/render_538.py
          git checkout -- src/chart_config.py
      - name: Verify pixels, background, and four-edge margins; make mobile previews
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from scripts.qa_social_rendered import check_chart
          path=Path("output/minard_vnext_preview.png")
          check_chart(path)
          im=Image.open(path).convert("RGB")
          for size in (390,320):
              out=path.with_name(f"minard_vnext_preview_{size}.png")
              im.resize((size,size),Image.Resampling.LANCZOS).save(out)
              print("Preview:",out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: minard-vnext-phone-review
          path: output/minard_vnext_preview*.png
          if-no-files-found: error
