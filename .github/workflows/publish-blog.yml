name: Publish coffeetableviz blog

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "archive/projects/**/ASSETS.sha256"
      - "scripts/validate_gallery_assets.py"
      - "archive/projects/2026-11-interwoven/RECOVERY_ASSETS.sha256"
      - "spec/series/blockbuster-quote.md"
      - "spec/series/data-lens.md"
      - "scripts/validate_blockbuster_quotes.rb"
      - "scripts/validate_data_lens.rb"
      - "scripts/render_blockbuster_quote.py"
      - "requirements-render.txt"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/publish-blog.yml"
  pull_request:
    paths:
      - "site/**"
      - "archive/projects/**/ASSETS.sha256"
      - "scripts/validate_gallery_assets.py"
      - "archive/projects/2026-11-interwoven/RECOVERY_ASSETS.sha256"
      - "spec/series/blockbuster-quote.md"
      - "spec/series/data-lens.md"
      - "scripts/validate_blockbuster_quotes.rb"
      - "scripts/validate_data_lens.rb"
      - "scripts/render_blockbuster_quote.py"
      - "requirements-render.txt"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/publish-blog.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Blockbuster Quote editions
        run: ruby scripts/validate_blockbuster_quotes.rb

      - name: Validate Data Lens editions and resources
        run: ruby scripts/validate_data_lens.rb

      - name: Validate approved Interwoven release assets
        run: |
          if sha256sum --check --status archive/projects/2026-11-interwoven/ASSETS.sha256; then
            echo "Exact original approved assets verified"
          else
            sha256sum --check archive/projects/2026-11-interwoven/RECOVERY_ASSETS.sha256
          fi

      - name: Validate all gallery release media
        run: python3 scripts/validate_gallery_assets.py

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Verify built Interwoven media and pages
        run: |
          for f in artwork.png card.jpg detail.png gallery.jpg walkthrough.mp4; do
            cmp "site/assets/gallery/interwoven/$f" "_site/assets/gallery/interwoven/$f"
          done
          test -s _site/gallery/index.html
          test -s _site/gallery/interwoven/index.html
          test -s _site/gallery/interwoven/explore/index.html
          test -s _site/stories/interwoven-when-data-becomes-art/index.html

      - name: Verify built gallery media and pages
        run: python3 scripts/validate_gallery_assets.py --built _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
