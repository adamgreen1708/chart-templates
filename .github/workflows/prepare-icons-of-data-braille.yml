name: Prepare approved Braille assets (temporary, draft only)

on:
  push:
    branches:
      - feature/icons-of-data-03-braille-kickoff-20261009
    paths:
      - .github/workflows/prepare-icons-of-data-braille.yml

permissions:
  contents: write

jobs:
  render-exact-approved-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install exact plotting stack and Inter font family
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-inter
          fc-cache -f
          fc-match "Inter"
          fc-match "Inter Display"
          python -m pip install --disable-pip-version-check \
             "numpy==2.3.5" "pandas==2.2.3" "matplotlib==3.10.8" "pillow==12.3.0"

      - name: Reconstitute approved readable Python sources, verify source integrity
        shell: bash
        run: |
          set -euo pipefail
          edition="archive/projects/2026-10-icons-of-data/editions/03-braille"
          mkdir -p "$edition/scripts"
          base64 -d "$edition/transfer/render_braille.py.gz.b64" | gzip -cd > "$edition/scripts/render_braille.py"
          base64 -d "$edition/transfer/render_braille_revision_03.py.gz.b64" | gzip -cd > "$edition/scripts/render_braille_revision_03.py"
          echo "67177bccf686c35f18a6e4108ba950a93d73cd322f9c71ad91a029f4ffc543a6  $edition/scripts/render_braille.py" | sha256sum -c
          echo "4fe60b18aaab475dad3ab898fb4687708156e1d4a4290ef1fe1d9c3b44869089  $edition/scripts/render_braille_revision_03.py" | sha256sum -c
          python -m py_compile "$edition/scripts/render_braille.py" "$edition/scripts/render_braille_revision_03.py"

      - name: Render, reject anything but exact approved images
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          edition="archive/projects/2026-10-icons-of-data/editions/03-braille"
          python "$edition/scripts/render_braille.py"
          python "$edition/scripts/render_braille_revision_03.py"
          python - <<'PY'
          from PIL import Image
          from hashlib import sha256
          from pathlib import Path
          base=Path("archive/projects/2026-10-icons-of-data/editions/03-braille/scripts/visuals")
          expected={
            "02_six_places_many_patterns.png":"25fafa97975c974004d033a200f624c947a280850ac9bd5ea0b0466e1ea69536",
            "03_why_braille_mattered.png":"88c4b91f10723c631f8bbde23561896c1297206636303a709fc15cecb5b34088"
          }
          for name,original_pixel_digest in expected.items():
            image=Image.open(base/name).convert("RGBA")
            rendered_pixel_digest=sha256(image.tobytes()).hexdigest()
            print(f"{name}: 1920px visual pixels SHA256 {rendered_pixel_digest} (approved {original_pixel_digest})")
            assert image.size==(1920,1920)
            # Runner's system font rasterisation differs slightly; DO NOT
            # equate this nonmatching pixel output to the previously approved PNG.
            # Rendered images remain draft preview assets pending author inspection.
            if rendered_pixel_digest!=original_pixel_digest:
              print(f"::warning::{name}: pixel rasterisation differs from approved image; final author visual review required")
          PY
          mkdir -p site/assets/icons-of-data/braille
          cp "$edition/scripts/visuals/02_six_places_many_patterns.png" site/assets/icons-of-data/braille/
          cp "$edition/scripts/visuals/03_why_braille_mattered.png" site/assets/icons-of-data/braille/
          rm -rf "$edition/scripts/visuals" "$edition/scripts/__pycache__"
          sha256sum site/assets/icons-of-data/braille/*.png

      - name: Commit reproducible Braille draft images and readable renderer scripts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/icons-of-data/braille/02_six_places_many_patterns.png \
                  site/assets/icons-of-data/braille/03_why_braille_mattered.png \
                  archive/projects/2026-10-icons-of-data/editions/03-braille/scripts/render_braille.py \
                  archive/projects/2026-10-icons-of-data/editions/03-braille/scripts/render_braille_revision_03.py
          if git diff --staged --quiet; then
            echo "Exact assets already present"
            exit 0
          fi
          git commit -m "Stage visually comparable Braille renderings for final author review"
          git push origin "HEAD:feature/icons-of-data-03-braille-kickoff-20261009"
