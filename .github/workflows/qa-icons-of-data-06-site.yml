name: Icons of Data 06 Snow full article QA (temporary)

on:
  push:
    branches: [feature/icons-of-data-06-john-snow-kickoff-20261012]
    paths: [.github/workflows/qa-icons-of-data-06-site.yml]

permissions:
  contents: write

jobs:
  review-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Copy exactly approved images with SHA-256 match
        shell: bash
        run: |
          set -euo pipefail
          edition=archive/projects/2026-10-icons-of-data/editions/06-john-snow
          mkdir -p site/assets/icons-of-data/john-snow
          echo '025cfcef1e21220ca82eb0b703d65494bd8670962934b3514c173764e172d166' > /tmp/expected-original.txt
          for spec in \
            '025cfcef1e21220ca82eb0b703d65494bd8670962934b3514c173764e172d166  01_snow_original_wellcome_L0063431_review.jpg' \
            'd1add220b9e69e44b2392e7b0f23ea1af5bff1dbecebd1180f41c0e5fd4f16bd  02_the_pattern_mapped.png' \
            '458087d1fb8072e51963c67c5868c5baad0bc3dcc86b9edda1d55aea21bf8edb  03_decode_the_icon.png'
          do
            sha="$(echo "$spec" | cut -d' ' -f1)"
            name="$(echo "$spec" | awk '{print $2}')"
            src="$edition/qa/visuals/$name"
            dst="site/assets/icons-of-data/john-snow/$name"
            echo "$sha  $src" | sha256sum -c
            cp "$src" "$dst"
            echo "$sha  $dst" | sha256sum -c
          done
          echo 'Exact approved PNG and historic photo bytes staged.'

      - name: Build actual Jekyll website
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Browser QA on desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          python -m pip install 'playwright==1.56.0'
          python -m http.server 8026 --directory ./_site --bind 127.0.0.1 > /tmp/snow-qa-server.log 2>&1 &
          mkdir -p archive/projects/2026-10-icons-of-data/editions/06-john-snow/qa/site
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          qa=Path("archive/projects/2026-10-icons-of-data/editions/06-john-snow/qa/site")
          with sync_playwright() as pw:
            browser=pw.chromium.launch(channel="chrome",headless=True,args=["--no-sandbox"])
            for label,w,h in [("desktop",1365,960),("mobile",390,844),("narrow",320,680)]:
              page=browser.new_page(viewport={"width":w,"height":h},device_scale_factor=1)
              errors=[]
              page.on("pageerror",lambda exc:errors.append(str(exc)))
              resp=page.goto("http://127.0.0.1:8026/icons-of-data/john-snow-cholera-map/",wait_until="networkidle",timeout=45000)
              assert resp.status==200,(label,"http",resp.status)
              assert "The map that put a pump on trial" in page.locator(".post-hero h1").inner_text()
              figures=page.locator(".story-chart img")
              assert figures.count()==3,(label,"three figures",figures.count())
              for index,(expected_w,expected_h) in enumerate([(1600,1534),(1920,1920),(1920,1920)]):
                img=figures.nth(index)
                img.scroll_into_view_if_needed()
                img.evaluate("(el)=>{el.loading='eager';return el.decode()}")
                data=img.evaluate("(el)=>({w:el.naturalWidth,h:el.naturalHeight,alt:el.alt,src:el.currentSrc})")
                print(label,index,data,flush=True)
                assert data["w"]==expected_w and data["h"]==expected_h,(label,index,"image size",data)
                assert len(data["alt"])>90,(label,index,"image alt text too short")
              assert page.locator(".method-note").count()==1
              assert page.locator('a[href="https://creativecommons.org/licenses/by/4.0/"]').count()>=1
              assert page.locator('a[href*="Wellcome_L0063431"]').count()>=1
              assert page.evaluate("document.documentElement.scrollWidth")<=w+1,(label,"horizontal overflow",page.evaluate("document.documentElement.scrollWidth"))
              assert page.locator(".post-hero h1").evaluate("(el)=>el.scrollWidth<=el.clientWidth+1"),(label,"title clipping")
              assert not errors,errors
              page.evaluate("scrollTo(0,0)")
              page.screenshot(path=str(qa/f"snow-article-{label}.png"),full_page=True)
              page.close()
            resources=browser.new_page(viewport={"width":390,"height":844},device_scale_factor=1)
            r=resources.goto("http://127.0.0.1:8026/resources/icons-of-data/",wait_until="networkidle")
            assert r.status==200
            for slug in ["minard","beck-tube-map","braille","nightingale-mortality","dubois-spiral","john-snow-cholera-map"]:
              assert resources.locator(f'a[href$="/icons-of-data/{slug}/"]').count()>=1,slug
            assert "Six stories" in resources.locator("body").inner_text()
            assert resources.evaluate("document.documentElement.scrollWidth")<=391
            resources.screenshot(path=str(qa/"snow-resources-mobile.png"),full_page=True)
            resources.close()
            homepage=browser.new_page(viewport={"width":390,"height":844},device_scale_factor=1)
            home=homepage.goto("http://127.0.0.1:8026/",wait_until="networkidle")
            assert home.status==200
            assert homepage.locator('a[href$="/icons-of-data/john-snow-cholera-map/"]').count()>=1
            assert homepage.evaluate("document.documentElement.scrollWidth")<=391
            homepage.screenshot(path=str(qa/"snow-home-mobile.png"),full_page=True)
            homepage.close()
            browser.close()
          print("Jekyll and Playwright passed: 1365px/390px/320px article, six Resources items, homepage card",flush=True)
          PY

      - name: Commit approved site assets and review screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/icons-of-data/john-snow \
                  archive/projects/2026-10-icons-of-data/editions/06-john-snow/qa/site/
          if ! git diff --staged --quiet; then
            git commit -m "Stage John Snow original and exact author-approved figures with Jekyll site QA"
            git fetch origin feature/icons-of-data-06-john-snow-kickoff-20261012
            git rebase origin/feature/icons-of-data-06-john-snow-kickoff-20261012
            git push origin "HEAD:feature/icons-of-data-06-john-snow-kickoff-20261012"
          fi
