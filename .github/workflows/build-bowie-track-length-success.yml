name: Build Bowie track length and success dataset

on:
  push:
    branches:
      - project/2026-09-david-bowie-track-length-success
    paths:
      - archive/projects/2026-09-david-bowie-track-length-success/scripts/build_track_length_dataset.py
      - archive/projects/2026-09-david-bowie-track-length-success/scripts/enrich_current_streams.py
      - archive/projects/2026-09-david-bowie-track-length-success/scripts/enrich_uk_official_charts.py
      - archive/projects/2026-09-david-bowie-track-length-success/data/source_album_spine.csv
      - .github/workflows/build-bowie-track-length-success.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install enrichment dependencies
        run: pip install requests beautifulsoup4

      - name: Build canonical Bowie track dataset
        run: python archive/projects/2026-09-david-bowie-track-length-success/scripts/build_track_length_dataset.py

      - name: QA canonical track dataset
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path("archive/projects/2026-09-david-bowie-track-length-success/data/david_bowie_tracks_core.csv")
          rows = list(csv.DictReader(path.open(encoding="utf-8")))
          albums = {row["album_title"] for row in rows}
          missing = [row for row in rows if not row["duration_seconds"]]
          if len(albums) != 26:
              raise SystemExit(f"Expected 26 albums, found {len(albums)}")
          if not 200 <= len(rows) <= 400:
              raise SystemExit(f"Implausible canonical track count: {len(rows)}")
          if missing:
              raise SystemExit(f"Missing durations: {len(missing)}")
          print(f"Core QA: {len(rows)} tracks, {len(albums)} albums, 0 missing durations")
          PY

      - name: Join current Spotify stream snapshot
        run: python archive/projects/2026-09-david-bowie-track-length-success/scripts/enrich_current_streams.py

      - name: QA streaming join
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path("archive/projects/2026-09-david-bowie-track-length-success/data/david_bowie_tracks_streams.csv")
          rows = list(csv.DictReader(path.open(encoding="utf-8")))
          matched = [r for r in rows if r["spotify_match_status"] == "matched"]
          snapshots = {r["spotify_snapshot_date"] for r in rows if r["spotify_snapshot_date"]}
          if len(rows) < 200:
              raise SystemExit("Streaming output lost canonical rows")
          if len(matched) < 150:
              raise SystemExit(f"Too few streaming matches: {len(matched)}")
          if len(snapshots) != 1:
              raise SystemExit(f"Expected one dated Spotify snapshot, found: {snapshots}")
          print(f"Streaming QA: matched={len(matched)}/{len(rows)} snapshot={next(iter(snapshots))}")
          PY

      - name: Join Official Singles Chart history
        run: python archive/projects/2026-09-david-bowie-track-length-success/scripts/enrich_uk_official_charts.py

      - name: QA success dataset
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path("archive/projects/2026-09-david-bowie-track-length-success/data/david_bowie_tracks_success.csv")
          rows = list(csv.DictReader(path.open(encoding="utf-8")))
          charted = [r for r in rows if r["uk_chart_match_status"] == "matched"]
          if len(rows) < 200:
              raise SystemExit("Success output lost canonical rows")
          if len(charted) < 20:
              raise SystemExit(f"Too few Official Singles Chart matches: {len(charted)}")
          print(f"Success QA: chart-matched album tracks={len(charted)}/{len(rows)}")
          PY

      - name: Commit generated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             archive/projects/2026-09-david-bowie-track-length-success/data/david_bowie_tracks_core.csv             archive/projects/2026-09-david-bowie-track-length-success/data/david_bowie_tracks_streams.csv             archive/projects/2026-09-david-bowie-track-length-success/data/david_bowie_tracks_success.csv
          if git diff --cached --quiet; then
            echo "No dataset changes"
          else
            git commit -m "Build Bowie track length and success datasets"
            git push
          fi
