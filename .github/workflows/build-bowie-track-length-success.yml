name: Build Bowie track length dataset

on:
  push:
    branches:
      - project/2026-09-david-bowie-track-length-success
    paths:
      - archive/projects/2026-09-david-bowie-track-length-success/scripts/build_track_length_dataset.py
      - archive/projects/2026-09-david-bowie-track-length-success/data/source_album_spine.csv
      - .github/workflows/build-bowie-track-length-success.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build canonical Bowie track dataset
        run: python archive/projects/2026-09-david-bowie-track-length-success/scripts/build_track_length_dataset.py

      - name: QA generated dataset
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path("archive/projects/2026-09-david-bowie-track-length-success/data/david_bowie_tracks_core.csv")
          rows = list(csv.DictReader(path.open(encoding="utf-8")))
          albums = {row["album_title"] for row in rows}
          missing = [row for row in rows if not row["duration_seconds"]]
          if len(albums) != 26:
              raise SystemExit(f"Expected 26 albums, found {len(albums)}")
          if len(rows) < 150:
              raise SystemExit(f"Implausibly small track table: {len(rows)} rows")
          print(f"QA: {len(rows)} tracks, {len(albums)} albums, {len(missing)} missing durations")
          PY

      - name: Commit generated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/projects/2026-09-david-bowie-track-length-success/data/david_bowie_tracks_core.csv
          if git diff --cached --quiet; then
            echo "No dataset changes"
          else
            git commit -m "Build canonical Bowie track dataset"
            git push
          fi
