name: Create whisky flavour menu dataset

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandas
        run: pip install pandas

      - name: Generate dataset
        run: python src/create_whisky_flavour_menu.py

      - name: Commit generated dataset
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/scotch_whisky_flavour_menu.csv

          git commit -m "Generate whisky flavour menu dataset" || echo "No changes"

          git push