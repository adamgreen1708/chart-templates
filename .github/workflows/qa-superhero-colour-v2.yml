name: QA redesigned superhero colours (draft only)

on:
  push:
    branches:
      - "draft/2026-11-superhero-story-redesign"
    paths:
      - ".github/workflows/qa-superhero-colour-v2.yml"
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tests and images
        run: |
          python -m pip install -r requirements-render.txt
          python -m pip install pytest pillow
      - name: Rebuild all derived views from real character records
        run: python archive/projects/2026-11-superhero-colour-code/scripts/build_chart_views.py
      - name: Validate the data-to-chart contract
        run: python -m pytest tests/test_palette_story.py -q
      - name: Generate phone exports and enforce outer safety frame
        run: python archive/projects/2026-11-superhero-colour-code/scripts/qa_palette_v2.py
      - name: Upload final 320px and 390px previews
        uses: actions/upload-artifact@v4
        with:
          name: superhero-colour-v2-phone-review
          path: archive/projects/2026-11-superhero-colour-code/output/qa_v2/*.png
          if-no-files-found: error
      - name: Save preview images to draft branch for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/projects/2026-11-superhero-colour-code/output/qa_v2
          git diff --staged --quiet || git commit -m "Add social-square v2 phone review images"
          git push
