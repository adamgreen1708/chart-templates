name: Rebuild Bowie five-album profiles after order QA

on:
  push:
    branches:
      - project/2026-09-david-bowie-five-album-audio-features
    paths:
      - .github/workflows/rebuild-bowie-five-album-order.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer dependencies
        run: pip install matplotlib numpy

      - name: Sync canonical order into enriched dataset
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          base=Path("archive/projects/2026-09-david-bowie-five-album-audio-features/data")
          spine=base/"five_album_track_spine.csv"
          enriched=base/"five_album_audio_features.csv"

          with spine.open(newline="", encoding="utf-8") as f:
              s=list(csv.DictReader(f))
          with enriched.open(newline="", encoding="utf-8") as f:
              e=list(csv.DictReader(f))

          order={(r["album_title"],r["track_title"]):(r["track_number"],r["track_position"]) for r in s}
          for r in e:
              key=(r["album_title"],r["track_title"])
              if key not in order:
                  raise SystemExit(f"Missing spine key: {key}")
              r["track_number"],r["track_position"]=order[key]

          fields=list(e[0].keys())
          with enriched.open("w", newline="", encoding="utf-8") as f:
              w=csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              w.writerows(e)

          heroes=[r for r in e if r["album_title"]=="Heroes"]
          heroes.sort(key=lambda r:int(r["track_position"]))
          print("Heroes final order:")
          for r in heroes:
              print(r["track_position"], r["track_title"])
          PY

      - name: Render final five profiles
        run: |
          python archive/projects/2026-09-david-bowie-five-album-audio-features/scripts/render_five_album_audio_profiles.py

      - name: Commit final ordered data and outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             archive/projects/2026-09-david-bowie-five-album-audio-features/data/five_album_audio_features.csv             archive/projects/2026-09-david-bowie-five-album-audio-features/output/*_audio_profile.png
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Rebuild Bowie profiles in canonical album order"
            git push
          fi
