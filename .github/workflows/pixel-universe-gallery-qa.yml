name: Pixel Universe gallery QA

on:
  pull_request:
    paths:
      - 'archive/projects/2026-11-pixel-universe/**'
      - 'site/resources/pixel-universe/**'
      - 'site/assets/pixel-universe/**'
      - 'site/_data/pixel_universe.yml'
      - 'site/assets/css/pixel-universe.css'
      - 'site/assets/js/pixel-art-builder.js'
      - 'tests/test_pixel_universe_*.py'
      - '.github/workflows/pixel-universe-gallery-qa.yml'
  push:
    branches: [main]
    paths:
      - 'archive/projects/2026-11-pixel-universe/**'
      - 'site/resources/pixel-universe/**'
      - 'site/assets/pixel-universe/**'
      - 'site/_data/pixel_universe.yml'
      - 'site/assets/css/pixel-universe.css'
      - 'site/assets/js/pixel-art-builder.js'
      - 'tests/test_pixel_universe_*.py'
      - '.github/workflows/pixel-universe-gallery-qa.yml'

permissions:
  contents: read

jobs:
  verify-pixel-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source and approved art
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate exact generated Jekyll data and icon assets
        run: python archive/projects/2026-11-pixel-universe/scripts/build_pixel_universe_gallery.py --check
      - name: Verify original icons, 12-character source parity, links and mosaics
        run: python -m pytest tests/test_pixel_universe_palette_compat.py tests/test_pixel_universe_prototypes.py tests/test_pixel_universe_full_set.py tests/test_pixel_universe_gallery.py -q
