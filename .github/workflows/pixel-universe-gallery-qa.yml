name: Pixel Universe gallery QA

on:
  pull_request:
    paths:
      - 'archive/projects/2026-11-pixel-universe/**'
      - 'site/resources/pixel-universe/**'
      - 'site/assets/pixel-universe/**'
      - 'site/_posts/2026-11-08-pixel-universe-256-squares.md'
      - 'site/_data/pixel_universe.yml'
      - 'site/assets/css/pixel-universe.css'
      - 'site/assets/js/pixel-art-builder.js'
      - 'tests/test_pixel_universe_*.py'
      - '.github/workflows/pixel-universe-gallery-qa.yml'
  push:
    branches: [main]
    paths:
      - 'archive/projects/2026-11-pixel-universe/**'
      - 'site/resources/pixel-universe/**'
      - 'site/assets/pixel-universe/**'
      - 'site/_posts/2026-11-08-pixel-universe-256-squares.md'
      - 'site/_data/pixel_universe.yml'
      - 'site/assets/css/pixel-universe.css'
      - 'site/assets/js/pixel-art-builder.js'
      - 'tests/test_pixel_universe_*.py'
      - '.github/workflows/pixel-universe-gallery-qa.yml'

permissions:
  contents: read

jobs:
  mobile-gallery-browser:
    name: Real-browser gallery QA (320px / 390px)
    needs: verify-pixel-universe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build actual GitHub Pages Jekyll output
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Inspect 320, 390, 768 and 1280px gallery and open Studio preset
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory _site > /tmp/pixel-universe-gallery-server.log 2>&1 &
          python tests/browser_pixel_universe_gallery.py
      - name: Save visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-universe-visual-qa
          path: output/pixel-universe-mobile-qa/*.png
          if-no-files-found: ignore

  verify-pixel-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source and approved art
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate exact generated Jekyll data and icon assets
        run: python archive/projects/2026-11-pixel-universe/scripts/build_pixel_universe_gallery.py --check
      - name: Validate exact 16x16 Pixel Studio feature-art raster geometry
        run: python archive/projects/2026-11-pixel-universe/scripts/render_feature_pixelstudio.py --check
      - name: Verify original icons, 12-character source parity, links and mosaics
        run: python -m pytest tests/test_pixel_universe_palette_compat.py tests/test_pixel_universe_prototypes.py tests/test_pixel_universe_full_set.py tests/test_pixel_universe_gallery.py tests/test_pixel_universe_editorial.py tests/test_pixel_universe_publication.py -q
