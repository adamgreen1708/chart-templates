name: EPL 2026-27 browser and data QA
on:
  pull_request:
    paths:
      - "preview/epl-2026-27/**"
      - "site/resources/epl-2026-27-unfolded/**"
      - "site/assets/js/epl-2627-unfolded.js"
      - "site/assets/css/epl-2627-unfolded.css"
      - "site/assets/data/epl-2627-unfolded.json"
      - "archive/projects/2026-11-epl-2627-unfolded/**"
      - "scripts/qa/epl_2627_browser_test.py"
      - ".github/workflows/epl-2627-qa.yml"
      - ".github/workflows/epl-2627-refresh.yml"
  workflow_dispatch:

permissions:
  # Write is used exclusively to update verified candidate data on the DRAFT PR branch.
  contents: write

jobs:
  verify:
    name: Verified data + Chromium 1440 / 390 / 320
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not push a detached synthetic pull-request merge commit to the feature branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate deterministic 2026-27 data
        run: |
          python -m py_compile archive/projects/2026-11-epl-2627-unfolded/scripts/build_data.py archive/projects/2026-11-epl-2627-unfolded/scripts/football_data_org.py
          python -m unittest discover -s scripts/qa -p 'test_epl_2627_provider.py' -v
          python archive/projects/2026-11-epl-2627-unfolded/scripts/build_data.py --check
      - name: Read-only source freshness and reachability probe
        run: python scripts/qa/epl_2627_source_health.py
      - name: Verify authenticated football-data.org source and historical results (read only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: |
          python archive/projects/2026-11-epl-2627-unfolded/scripts/build_data.py --probe-provider --provider football-data-org
      - name: Build fresh verified source candidate without committing or publishing
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: |
          python archive/projects/2026-11-epl-2627-unfolded/scripts/build_data.py --refresh --provider football-data-org
          python archive/projects/2026-11-epl-2627-unfolded/scripts/build_data.py --check
          git diff --name-only | tee /tmp/epl-2627-candidate-paths.txt
          if grep -Ev '^(archive/projects/2026-11-epl-2627-unfolded/data/matches_2627.csv|site/assets/data/epl-2627-unfolded.json)$' /tmp/epl-2627-candidate-paths.txt; then
            echo "::error::Unexpected file modified by source conversion"
            exit 1
          fi
      - name: Upload provider candidate CSV and JSON for editor review
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: epl-2627-verified-data-candidate
          path: |
            archive/projects/2026-11-epl-2627-unfolded/data/matches_2627.csv
            site/assets/data/epl-2627-unfolded.json
          if-no-files-found: error
      - name: Install Chromium Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium --with-deps
      - name: Start review-only local web server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/epl-2627-preview-http.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/preview/epl-2026-27/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/epl-2627-preview-http.log
          exit 1
      - name: Real browser mobile/desktop screenshots and interactions
        run: python scripts/qa/epl_2627_browser_test.py
      - name: Check HTTPS branch preview resolves for independent review
        shell: bash
        run: |
          URL="https://raw.githack.com/adamgreen1708/chart-templates/feature/epl-2627-season-unfolded/preview/epl-2026-27/index.html"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 35 --silent --show-error "$URL" -o /tmp/epl-2627-remote.html
          grep -q 'id="epl-unfolded"' /tmp/epl-2627-remote.html
      - name: Save tested data ONLY to the existing draft review branch (never main)
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'feature/epl-2627-season-unfolded' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git add -- archive/projects/2026-11-epl-2627-unfolded/data/matches_2627.csv site/assets/data/epl-2627-unfolded.json
          if git diff --cached --quiet; then
            echo "Verified dataset is unchanged; no review-branch commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Review data: import verified 2026-27 EPL FINISHED matches"
          # A concurrent user edit makes the push non-fast-forward and therefore fails safely.
          git push origin HEAD:refs/heads/feature/epl-2627-season-unfolded
      - name: Upload screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epl-2627-review-browser-qa
          path: qa_screenshots/epl-2627/
          if-no-files-found: warn
