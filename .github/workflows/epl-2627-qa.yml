name: EPL 2026-27 browser and data QA
on:
  pull_request:
    paths:
      - "preview/epl-2026-27/**"
      - "site/resources/epl-2026-27-unfolded/**"
      - "site/resources/index.html"
      - "site/resources/epl-2025-26-unfolded/**"
      - "site/_posts/2026-11-22-premier-league-season-unfolded-2025-26.md"
      - "site/_includes/epl-2526-interactive.html"
      - "site/assets/features/epl-2627-season-unfolded-editorial.svg"
      - "scripts/qa/epl_resources_browser_test.py"
      - "site/assets/js/epl-2627-unfolded.js"
      - "site/assets/css/epl-2627-unfolded.css"
      - "site/assets/data/epl-2627-unfolded.json"
      - "archive/projects/2026-11-epl-2627-unfolded/**"
      - "scripts/qa/epl_2627_browser_test.py"
      - ".github/workflows/epl-2627-qa.yml"
      - ".github/workflows/epl-2627-refresh.yml"
  workflow_dispatch:

permissions:
  # Test the PR's committed candidate data read-only; no writes or branch pushes.
  contents: read

jobs:
  verify:
    name: Verified data + Chromium 1440 / 390 / 320
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not push a detached synthetic pull-request merge commit to the feature branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate deterministic 2026-27 data
        run: |
          python -m py_compile archive/projects/2026-11-epl-2627-unfolded/scripts/build_data.py archive/projects/2026-11-epl-2627-unfolded/scripts/football_data_org.py
          python -m unittest discover -s scripts/qa -p 'test_epl_2627_provider.py' -v
          python archive/projects/2026-11-epl-2627-unfolded/scripts/build_data.py --check
      - name: Read-only source freshness and reachability probe
        run: python scripts/qa/epl_2627_source_health.py
      - name: Read-only live source and historical data consistency probe
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: |
          python archive/projects/2026-11-epl-2627-unfolded/scripts/build_data.py --probe-provider --provider football-data-org
      - name: Install Chromium Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium --with-deps
      - name: Start review-only local web server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/epl-2627-preview-http.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/preview/epl-2026-27/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/epl-2627-preview-http.log
          exit 1
      - name: Real browser mobile/desktop screenshots and interactions
        run: python scripts/qa/epl_2627_browser_test.py
      - name: Check the published 2026–27 HTTPS route resolves
        shell: bash
        run: |
          URL="https://coffeetableviz.com/resources/epl-2026-27-unfolded/"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 35 --silent --show-error "$URL" -o /tmp/epl-2627-remote.html
          grep -q 'id="epl-unfolded"' /tmp/epl-2627-remote.html
      - name: Build site with Jekyll for Resources and archive QA
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - name: Validate current Resources and archived 2025-26 blog in real browser
        shell: bash
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory _site > /tmp/epl-resource-http.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8766/resources/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8766/stories/premier-league-season-unfolded-2025-26/ >/dev/null
          python scripts/qa/epl_resources_browser_test.py
      - name: Upload screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epl-2627-review-browser-qa
          path: |
            qa_screenshots/epl-2627/
            qa_screenshots/epl-resources/
          if-no-files-found: warn
