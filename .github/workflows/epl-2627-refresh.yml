name: Daily EPL 2026-27 verified results refresh
on:
  schedule:
    # Check every day at 08:30 Europe/London (07:30 UTC in BST; 08:30 UTC in GMT).
    # Both UTC schedules fire; the DST-safe gate below skips the non-matching one.
    - cron: '30 7 * * *'
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'review: propose data-only PR; publish: apply EPL-only safeguarded merge after checks'
        required: true
        type: choice
        default: review
        options: [review, publish]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: epl-2627-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # EPL-only: daily checks and verified data-only PRs auto-publish after independent QA.
    # Emergency stop: set repository Actions variable EPL_AUTO_PUBLISH_PAUSED=true.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Gate schedule to daily 08:30 Europe/London (DST-safe)
        id: uk_clock
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          uk=datetime.now(ZoneInfo('Europe/London'))
          # GitHub cron may run late, so match the scheduled cron to UK DST.
          expected='30 7 * * *' if uk.utcoffset()==timedelta(hours=1) else '30 8 * * *'
          received=os.environ.get('EVENT_SCHEDULE','')
          allowed=os.environ['EVENT_NAME']!='schedule' or received==expected
          print('proceed='+('true' if allowed else 'false'))
          print('uk_now='+uk.isoformat())
          print('schedule_received='+received)
          print('schedule_expected='+expected)
          PY
      - name: Checkout main
        if: steps.uk_clock.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        if: steps.uk_clock.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch authenticated football-data.org finished results and validate history
        if: steps.uk_clock.outputs.proceed == 'true'
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: |
          python archive/projects/2026-11-epl-2627-unfolded/scripts/build_data.py --refresh --provider football-data-org
          python archive/projects/2026-11-epl-2627-unfolded/scripts/build_data.py --check
      - name: Detect unusually stale season data (active season only)
        if: steps.uk_clock.outputs.proceed == 'true'
        run: |
          python - <<'PY'
          import json, os
          from datetime import date, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          meta=json.loads(Path('site/assets/data/epl-2627-unfolded.json').read_text())['meta']
          today=datetime.now(ZoneInfo('Europe/London')).date()
          latest=date.fromisoformat(meta['lastDate'])
          days=(today-latest).days
          print(f"Latest 2026–27 result: {latest}; matches: {meta['matchCount']}; age: {days} days")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write(f"### EPL 2026–27 freshness\nLatest result: **{latest}**; completed matches: **{meta['matchCount']}**.\n")
          if not meta['complete'] and date(2026,8,1)<=today<=date(2027,5,31) and days>21:
              raise RuntimeError(f"No verified result for {days} days; investigate feed/fixture calendar")
          PY
      - name: Verify ONLY data-only paths changed
        id: diff
        if: steps.uk_clock.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | tee /tmp/epl-2627-changed.txt
          if grep -Ev '^(archive/projects/2026-11-epl-2627-unfolded/data/matches_2627.csv|site/assets/data/epl-2627-unfolded.json)$' /tmp/epl-2627-changed.txt; then
            echo "::error::Unexpected non-data path; requires manual review."
            exit 1
          fi
          if [[ ! -s /tmp/epl-2627-changed.txt ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Chromium Playwright
        if: steps.diff.outputs.changed == 'true'
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium --with-deps
      - name: Serve and test new live data on desktop and mobile
        if: steps.diff.outputs.changed == 'true'
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/epl-2627-http.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/preview/epl-2026-27/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8765/preview/epl-2026-27/index.html >/dev/null
          python scripts/qa/epl_2627_browser_test.py
      - name: Store QA evidence
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: epl-2627-daily-browser-evidence
          path: qa_screenshots/epl-2627/
          if-no-files-found: error
      - name: Require a token capable of triggering independent PR QA
        if: steps.diff.outputs.changed == 'true'
        env:
          EPL_PR_TOKEN: ${{ secrets.EPL_PR_TOKEN }}
        run: |
          if [[ -z "$EPL_PR_TOKEN" ]]; then
            echo "::error::Missing EPL_PR_TOKEN. Configure a fine-grained repo PAT with Contents and Pull requests write. GITHUB_TOKEN-created PRs do not trigger independent PR tests."
            exit 1
          fi
      - name: Create or update verified EPL data-only pull request
        if: steps.diff.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.EPL_PR_TOKEN }}
          branch: automation/epl-2627-verified-results
          base: main
          delete-branch: true
          add-paths: |
            archive/projects/2026-11-epl-2627-unfolded/data/matches_2627.csv
            site/assets/data/epl-2627-unfolded.json
          commit-message: 'Update EPL 2026-27 verified completed match data'
          title: 'Data only: refresh 2026–27 EPL completed results'
          body: |
            Verified FINISHED results from authenticated football-data.org v4 Premier League 2026–27 API.
            Only this EPL daily workflow can merge this data-only PR automatically, after independent QA and strict path/branch verification.
            Pull requests changing other files are never eligible.
            No design, editorial, 2025–26, JS, workflow or stylesheet files modified.
            Browser QA (1440 / 390 / 320), incremental fixture validation and
            deterministic data-build checks must succeed before merge.
            This is a proposed data update only, never a forecast.
      - name: Auto-publish EPL verified result data ONLY after independent checks
        # Only this workflow, and only its exact two generated data files, can auto-merge.
        # Review-only manual runs never merge. To suspend: set EPL_AUTO_PUBLISH_PAUSED=true.
        if: >-
          steps.pr.outputs.pull-request-number != '' &&
          vars.EPL_AUTO_PUBLISH_PAUSED != 'true' &&
          (github.event_name == 'schedule' || inputs.mode == 'publish')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.EPL_PR_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::EPL_PR_TOKEN required for independent PR checks and guarded merge"
            exit 1
          fi

          # PR #237 is the final manual sign-off before enabling hands-off updates.
          # Do not merge that existing release on the user's behalf.
          if [[ "$PR" == "237" ]]; then
            echo "PR #237 is intentionally reserved for manual approval; future EPL data PRs will auto-publish"
            exit 0
          fi

          # Never allow this workflow to auto-merge arbitrary PRs, code, site changes,
          # or data updates for a different season.
          metadata="$(gh pr view "$PR" --repo "$REPO" \
            --json title,headRefName,baseRefName,isCrossRepository,headRefOid)"
          if ! jq -e \
            --arg title 'Data only: refresh 2026–27 EPL completed results' \
            --arg head 'automation/epl-2627-verified-results' \
            '.title == $title and .headRefName == $head and .baseRefName == "main" and .isCrossRepository == false' \
            <<< "$metadata" >/dev/null; then
            echo "::error::EPL PR title, branch or base changed; refusing automatic merge"
            exit 1
          fi
          head_sha="$(jq -r '.headRefOid' <<< "$metadata")"
          mapfile -t files < <(gh api "repos/$REPO/pulls/$PR/files?per_page=100" \
            --jq '.[].filename' | LC_ALL=C sort)
          expected_csv='archive/projects/2026-11-epl-2627-unfolded/data/matches_2627.csv'
          expected_json='site/assets/data/epl-2627-unfolded.json'
          if [[ "${#files[@]}" -ne 2 ||
                "${files[0]}" != "$expected_csv" ||
                "${files[1]}" != "$expected_json" ]]; then
            printf 'Unexpected PR files (aborting):\n%s\n' "${files[@]}"
            echo "::error::Automatic publishing is restricted to the exact two EPL 2026–27 data files"
            exit 1
          fi

          # Wait for independent PR-triggered QA, not just checks in this schedule run.
          ready=false
          for i in $(seq 1 18); do
            if gh pr checks "$PR" --repo "$REPO" --json name \
                -q '.[] | select(.name | contains("Verified data + Chromium"))' | grep -q .; then
              ready=true
              break
            fi
            sleep 10
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::Independent pull_request Chromium/browser QA did not appear"
            exit 1
          fi
          gh pr checks "$PR" --repo "$REPO" --watch --fail-fast

          # Prevent racing against a changed PR head after the checks.
          verified_sha="$(gh pr view "$PR" --repo "$REPO" \
            --json headRefOid --jq '.headRefOid')"
          if [[ "$verified_sha" != "$head_sha" ]]; then
            echo "::error::PR head changed while checks were running; aborting"
            exit 1
          fi
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch \
            --match-head-commit "$head_sha"
      - name: Alert on failure or blocked automation
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.EPL_PR_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="EPL 2026–27 daily refresh needs review"
          existing="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number' || true)"
          msg="The daily verified EPL refresh failed. Review run: $RUN_URL. Existing published data must be left unchanged until checks and permissions are repaired."
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$REPO" --body "$msg"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$msg"
          fi
