name: Validate villain text alignment and wheel cast table (draft)
on:
  push:
    branches:
      - "draft/2026-11-superhero-art-direction"
    paths:
      - ".github/workflows/qa-superhero-v3-final-edits.yml"
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image/data QA dependencies
        run: |
          python -m pip install -r requirements-render.txt
          python -m pip install pytest pillow
      - name: Rebuild views from pilot source
        run: python archive/projects/2026-11-superhero-colour-code/scripts/build_chart_views.py
      - name: Test chart data and generated blog reference table
        run: python -m pytest tests/test_palette_story_v3.py tests/test_palette_blog_table_v3.py -q
      - name: Check latest full-size renders and refresh phone proofs
        run: python archive/projects/2026-11-superhero-colour-code/scripts/qa_palette_v3.py
      - name: Upload visual phone proofs
        uses: actions/upload-artifact@v4
        with:
          name: superhero-v3-final-edits-mobile
          path: archive/projects/2026-11-superhero-colour-code/output/qa_v3/*.png
          if-no-files-found: error
      - name: Commit exact 320px and 390px review PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/projects/2026-11-superhero-colour-code/output/qa_v3
          git diff --staged --quiet || git commit -m "Refresh mobile proofs after showdown text alignment fix"
          git push
