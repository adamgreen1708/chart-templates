name: Daily Coffeetableviz Pulse

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-site-pulse.yml"
      - "scripts/site_analytics_daily.py"
  schedule:
    - cron: "15 8 * * *"
    # Recovery run: only regenerates if yesterday’s report is missing.
    - cron: "15 18 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional Europe/London report date (YYYY-MM-DD). Defaults to yesterday."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-coffeetableviz-pulse
  cancel-in-progress: false

jobs:
  daily-pulse:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install chart dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt

      - name: Validate generator syntax
        run: python -m py_compile scripts/site_analytics_daily.py

      - name: Check if evening recovery is needed
        id: recovery
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          expected = (datetime.now(ZoneInfo("Europe/London")).date() - timedelta(days=1)).isoformat()
          path = Path("output/daily_site_pulse_latest.json")
          try:
              current = json.loads(path.read_text(encoding="utf-8")).get("report_date")
          except (FileNotFoundError, OSError, ValueError):
              current = None

          evening = (
              os.environ["EVENT_NAME"] == "schedule"
              and os.environ["EVENT_SCHEDULE"] == "15 18 * * *"
          )
          build = not (evening and current == expected)
          print(f"build={'true' if build else 'false'}")
          PY

      - name: Build Daily Pulse
        if: steps.recovery.outputs.build == 'true'
        env:
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GOATCOUNTER_API_TOKEN:-}" ]]; then
            echo "::error::GOATCOUNTER_API_TOKEN is not configured; Daily Pulse cannot run."
            exit 1
          fi

          # GoatCounter has intermittently returned HTTP 404 to scheduled runs.
          # Retry short-lived API failures, then let the evening schedule recover if needed.
          for attempt in 1 2 3; do
            if [[ -n "${{ inputs.report_date || '' }}" ]]; then
              if python scripts/site_analytics_daily.py --report-date "${{ inputs.report_date }}"; then
                exit 0
              fi
            else
              if python scripts/site_analytics_daily.py; then
                exit 0
              fi
            fi

            if [[ "$attempt" == "3" ]]; then
              echo "::error::Daily Pulse generation failed after 3 attempts."
              exit 1
            fi
            echo "::warning::Daily Pulse generation failed (attempt ${attempt}/3). Retrying in 60 seconds."
            sleep 60
          done

      - name: Upload latest pulse
        if: steps.recovery.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-site-pulse
          path: |
            output/daily_site_pulse.png
            output/daily_site_pulse_summary.md
            output/daily_site_pulse_latest.json
            data/site_analytics_daily.csv
          if-no-files-found: ignore

      - name: Commit updated analytics
        if: steps.recovery.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/site_analytics_daily.csv \
                  output/daily_site_pulse.png \
                  output/daily_site_pulse_summary.md \
                  output/daily_site_pulse_latest.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No Daily Pulse changes to commit."
            exit 0
          fi

          report_date="$(python -c 'import json; from pathlib import Path; p=Path("output/daily_site_pulse_latest.json"); print(json.loads(p.read_text())["report_date"] if p.exists() else "latest")')"
          git commit -m "Update Daily Pulse for ${report_date}"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Daily Pulse pushed successfully."
              exit 0
            fi

            echo "Push raced with another main update; retrying (${attempt}/3)."
            sleep 2
          done

          echo "::error::Failed to push Daily Pulse after 3 attempts."
          exit 1
