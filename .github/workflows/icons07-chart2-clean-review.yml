name: Icons 07 — Minimal Chart 02 render review
on:
  push:
    branches:
      - draft/icons07-chart2-cleaner-headings-20261021
    paths:
      - ".github/workflows/icons07-chart2-clean-review.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic chart dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 matplotlib==3.9.2 pillow==11.0.0
      - name: Render approved-source image collection
        run: python archive/projects/2026-10-icons-of-data/editions/07-hawkins/scripts/render_hawkins_review.py
      - name: Validate requested deletions, alignment and unchanged other figures
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          from PIL import Image
          root=pathlib.Path("archive/projects/2026-10-icons-of-data/editions/07-hawkins")
          script=(root/"scripts/render_hawkins_review.py").read_text()
          sub=script.split("def figure2():",1)[1].split("def rectangle(",1)[0]
          assert '"One year equals one stripe"' in sub
          assert "ONE YEAR  =  ONE STRIPE" not in sub
          assert "NOW ADD THE NUMBERS BACK" not in sub
          assert "Each stripe aligns with its year" not in sub
          meta=json.loads((root/"qa/render_manifest.json").read_text())
          assert meta["observations"]==176 and meta["year_2026_excluded"] is True
          geom=meta["figures"]["02"]["alignment"]
          assert geom["shared_year_bounds"]==[1849.5,2025.5]
          assert geom["max_horizontal_alignment_error"]==0
          assert geom["inclusive_reference_period_years"]==[1961,1990]
          assert geom["reference_window_bounds"]==[1960.5,1990.5]
          expected_fixed={
            "01_reading_global_2020_original_unmodified.jpg":"64ac4a7b3ed36fc7448b107caa4b6c222005013862ecf017947e24ad4d16f07f",
            "03_decode_the_icon.png":"b5eaac606edd53251cc86468a78da17658e16ae855b7be535f56dd7789ca0959"
          }
          for file,sha in expected_fixed.items():
            assert hashlib.sha256((root/"qa/visuals"/file).read_bytes()).hexdigest()==sha,file
          new=root/"qa/visuals/02_the_century_shifts_colour.png"
          assert hashlib.sha256(new.read_bytes()).hexdigest()==meta["figures"]["02"]["sha256"]
          assert meta["figures"]["02"]["sha256"]!="e79346b0b5840e373799bd38cd14f4fe741f162211f9b8c3f8cfd78f0177dfb2"
          with Image.open(new) as im: assert im.size==(1920,1920)
          for w in (600,390,320):
            with Image.open(new.with_name(f"02_the_century_shifts_colour_preview_{w}.png")) as im:
              assert im.size==(w,w)
          print("PASS: reduced chart copy, preserved year alignment, known baseline period and untouched historical original / decoder")
          PY
      - name: Stage only newly approved-candidate Chart 02 site asset
        run: |
          root=archive/projects/2026-10-icons-of-data/editions/07-hawkins
          cp "$root/qa/visuals/02_the_century_shifts_colour.png" site/assets/icons-of-data/ed-hawkins/02_the_century_shifts_colour.png
          cmp "$root/qa/visuals/01_reading_global_2020_original_unmodified.jpg" site/assets/icons-of-data/ed-hawkins/01_reading_global_2020_original_unmodified.jpg
          cmp "$root/qa/visuals/03_decode_the_icon.png" site/assets/icons-of-data/ed-hawkins/03_decode_the_icon.png
      - name: Build site in PR without publishing
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - name: Install browser QA
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test article desktop/mobile and create screenshots
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import subprocess,sys,time,urllib.request,json
          qa=Path("archive/projects/2026-10-icons-of-data/editions/07-hawkins/qa/site")
          qa.mkdir(parents=True,exist_ok=True)
          srv=subprocess.Popen([sys.executable,"-m","http.server","8765","--bind","127.0.0.1","--directory","_site"],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          results=[]
          try:
            for _ in range(40):
              try:
                with urllib.request.urlopen("http://127.0.0.1:8765/",timeout=2) as r:
                  if r.status==200: break
              except Exception:time.sleep(.3)
            else:raise RuntimeError("Preview server did not respond")
            with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              for width,label in [(1365,"desktop"),(390,"mobile"),(320,"narrow")]:
                page=browser.new_page(viewport={"width":width,"height":850},device_scale_factor=1)
                errors=[]
                page.on("pageerror",lambda e:errors.append(str(e)))
                r=page.goto("http://127.0.0.1:8765/icons-of-data/ed-hawkins-warming-stripes/",wait_until="load",timeout=60000)
                assert r.status==200
                imgs=page.locator("article.post figure.story-chart img")
                assert imgs.count()==3
                for i,d in enumerate([(1200,675),(1920,1920),(1920,1920)]):
                  img=imgs.nth(i)
                  img.scroll_into_view_if_needed()
                  img.evaluate("(x)=>x.decode()")
                  facts=img.evaluate("(x)=>[x.naturalWidth,x.naturalHeight,x.getBoundingClientRect().width, x.alt.length]")
                  assert tuple(facts[:2])==d,(label,i,facts)
                  assert facts[2] <= width+2 and facts[3]>80
                assert "1961–1990" in page.locator("article.post").inner_text()
                overflow=page.evaluate("document.documentElement.scrollWidth-window.innerWidth")
                assert overflow<=2,(label,overflow)
                assert not errors
                page.screenshot(path=str(qa/f"hawkins-article-{label}.png"),full_page=True)
                response=page.goto("http://127.0.0.1:8765/resources/icons-of-data/",wait_until="load")
                assert response.status==200
                assert page.locator(".icons-entry").count()==7
                assert page.evaluate("document.documentElement.scrollWidth-window.innerWidth")<=2
                results.append({"screen":label,"width":width,"article_images":3,"resources_stories":7,
                                "article_overflow":overflow,"js_errors":errors,"chart02":"reduced copy"})
                page.close()
              browser.close()
            (qa/"browser_qa.json").write_text(json.dumps({"result":"PASS","published":False,"revision":"clean Chart 02 labels","pages":results},indent=2)+"\n")
            print(json.dumps(results,indent=2))
          finally:
            srv.terminate()
            srv.wait(timeout=10)
          PY
      - name: Upload render and screenshots for author review
        uses: actions/upload-artifact@v4
        with:
          name: icons07-chart2-simplified-review
          path: |
            archive/projects/2026-10-icons-of-data/editions/07-hawkins/qa/visuals/02_the_century_shifts_colour*.png
            archive/projects/2026-10-icons-of-data/editions/07-hawkins/qa/render_manifest.json
            archive/projects/2026-10-icons-of-data/editions/07-hawkins/qa/site/**
          if-no-files-found: error
      - name: Commit exact GitHub-rendered draft image and QA
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/projects/2026-10-icons-of-data/editions/07-hawkins/qa/render_manifest.json
          git add archive/projects/2026-10-icons-of-data/editions/07-hawkins/qa/visuals/02_the_century_shifts_colour*.png
          git add archive/projects/2026-10-icons-of-data/editions/07-hawkins/qa/site/
          git add site/assets/icons-of-data/ed-hawkins/02_the_century_shifts_colour.png
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Render simplified Hawkins chart with minimal explanatory headings"
          git push origin HEAD:draft/icons07-chart2-cleaner-headings-20261021
