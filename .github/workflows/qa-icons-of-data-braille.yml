name: Prepare Braille tactile photograph and site QA (temporary)

on:
  push:
    branches:
      - feature/icons-of-data-03-braille-kickoff-20261009
    paths:
      - .github/workflows/qa-icons-of-data-braille.yml

permissions:
  contents: write

jobs:
  photo-and-browser-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare Pillow and browser
        run: |
          python -m pip install "Pillow==12.3.0" "playwright==1.56.0"
          command -v google-chrome

      - name: Fetch and verify properly licensed embossed Braille photograph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets/icons-of-data/braille
          python - <<'PY'
          from urllib.request import Request,urlopen
          from io import BytesIO
          from PIL import Image
          import hashlib, pathlib
          u="https://upload.wikimedia.org/wikipedia/commons/e/ee/Braille_text.jpg"
          with urlopen(Request(u,headers={"User-Agent":"Coffeetableviz research and attribution (https://coffeetableviz.com/)"}),timeout=60) as res:
            raw=res.read()
          checksum=hashlib.sha1(raw).hexdigest()
          print("Wikimedia source SHA-1:",checksum,flush=True)
          assert checksum=="28ffbfac9277b633ef0426eb6fb3701268071a73", "Commons licensed source bytes unexpectedly changed"
          image=Image.open(BytesIO(raw)).convert("RGB")
          assert image.size==(3266,2613),image.size
          image.thumbnail((960,768),Image.Resampling.LANCZOS)
          assert image.size==(960,768),image.size
          out=pathlib.Path("site/assets/icons-of-data/braille/01_embossed_braille.jpg")
          image.save(out,"JPEG",quality=88,optimize=True)
          print("Saved CC BY 2.0 photograph:",out,out.stat().st_size,flush=True)
          PY

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Browser screenshot and accessibility checks
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8019 --directory ./_site --bind 127.0.0.1 >/tmp/braille-preview-http.log 2>&1 &
          mkdir -p archive/projects/2026-10-icons-of-data/editions/03-braille/qa/site
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          qa=Path("archive/projects/2026-10-icons-of-data/editions/03-braille/qa/site")
          with sync_playwright() as p:
            browser=p.chromium.launch(channel="chrome",headless=True,args=["--no-sandbox"])
            for label,width,height in [('desktop',1365,960),('mobile',390,844),('narrow',320,680)]:
              page=browser.new_page(viewport={"width":width,"height":height},device_scale_factor=1)
              resp=page.goto("http://127.0.0.1:8019/icons-of-data/braille/",wait_until="networkidle",timeout=30000)
              assert resp.status==200,(label,resp.status)
              assert page.locator(".post-hero h1").inner_text()=="Six dots. Rather a lot to say."
              figures=page.locator(".story-chart img")
              assert figures.count()==3,(label,"figure count",figures.count())
              for index,expected_width in enumerate([960,1920,1920]):
                image=figures.nth(index)
                image.scroll_into_view_if_needed()
                image.evaluate("(img)=>{img.loading='eager';return img.decode();}")
                data=image.evaluate("(img)=>({src:img.currentSrc,w:img.naturalWidth,h:img.naturalHeight,alt:img.alt})")
                print(label,index,data,flush=True)
                assert data["w"]==expected_width and data["alt"],(label,index,"image or alt issue",data)
              assert page.evaluate("document.documentElement.scrollWidth")<=width+1,(label,"horizontal overflow")
              heading=page.locator(".post-hero h1")
              assert heading.evaluate("(h)=>h.scrollWidth<=h.clientWidth+1"),(label,"title clipping")
              assert page.locator(".method-note").count()==1
              assert page.locator('a[href*="creativecommons.org/licenses/by/2.0"]').count()>0
              page.evaluate("scrollTo(0,0)")
              page.screenshot(path=str(qa/f"braille-article-{label}.png"),full_page=True)
              page.close()
            page=browser.new_page(viewport={"width":390,"height":844},device_scale_factor=1)
            resp=page.goto("http://127.0.0.1:8019/resources/icons-of-data/",wait_until="networkidle",timeout=30000)
            assert resp.status==200
            assert page.locator('a[href$="/icons-of-data/minard/"]').count()>0
            assert page.locator('a[href$="/icons-of-data/beck-tube-map/"]').count()>0
            assert page.locator('a[href$="/icons-of-data/braille/"]').count()==1
            assert page.evaluate("document.documentElement.scrollWidth")<=391
            page.screenshot(path=str(qa/"braille-resources-mobile.png"),full_page=True)
            resp=page.goto("http://127.0.0.1:8019/",wait_until="networkidle",timeout=30000)
            assert resp.status==200
            assert "Six dots. Rather a lot to say." in page.locator(".latest h3").inner_text()
            photo=page.locator(".latest .feature-visual img")
            assert photo.count()==1
            photo.evaluate("(img)=>{img.loading='eager';return img.decode();}")
            assert photo.evaluate("(i)=>i.naturalWidth")==1920
            page.screenshot(path=str(qa/"braille-home-mobile.png"),full_page=True)
            print("Jekyll and browser checks passed",flush=True)
            browser.close()
          PY

      - name: Commit only the verified CC BY photograph and QA screenshots to draft
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/icons-of-data/braille/01_embossed_braille.jpg \
                  archive/projects/2026-10-icons-of-data/editions/03-braille/qa/site/*.png
          if ! git diff --staged --quiet; then
            git commit -m "Add attributed Braille tactile photograph and page QA screenshots"
            git push origin "HEAD:feature/icons-of-data-03-braille-kickoff-20261009"
          fi
