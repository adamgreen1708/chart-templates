name: Assemble Variations gallery media
on:
  push:
    branches: [feature/variations-on-a-theme]
    paths: [".github/workflows/assemble-variations-gallery.yml"]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate approved release
        run: |
          cat archive/projects/2026-11-variations-on-a-theme/transfer/part-* > site/assets/gallery/variations-on-a-theme/walkthrough.mp4
          sha256sum -c archive/projects/2026-11-variations-on-a-theme/ASSETS.sha256
          python3 scripts/validate_gallery_assets.py
      - name: Commit verified media and remove temporary transfer files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/gallery/variations-on-a-theme/walkthrough.mp4
          git rm -r archive/projects/2026-11-variations-on-a-theme/transfer
          git rm .github/workflows/assemble-variations-gallery.yml
          git commit -m "Assemble verified Variations gallery film"
          git push origin HEAD:feature/variations-on-a-theme
