name: QA unpublished superhero article with temporary Jekyll preview
# Recheck accessible chart titles in the full Jekyll article HTML.

on:
  push:
    branches:
      - "publish/2026-11-superhero-colour-story"
    paths:
      - ".github/workflows/qa-superhero-jekyll-unpublished-preview.yml"

permissions:
  contents: read

jobs:
  test-unpublished-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable post only in disposable runner for accurate preview build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path("site/_posts/2026-11-08-who-wears-the-hero-colours.md")
          text=path.read_text(encoding="utf-8")
          assert text.count("published: false")==1
          path.write_text(text.replace("published: false","published: true"),encoding="utf-8")
          print("Temporary preview only: source PR file remains unpublished")
          PY
      - name: Build actual unpublished article with site's production Jekyll action
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - name: Assert article, all three approved images and 24-person table render correctly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          site=Path("_site")
          post=site/"stories/who-wears-the-hero-colours/index.html"
          assert post.is_file(),f"Expected Jekyll article missing: {post}"
          html=post.read_text(encoding="utf-8")
          for fragment in ("Who wears the hero colours?","Good colours. Bad intentions.","Same paint. Different morals.","The Flash","Magneto","Venom"):
              assert fragment in html,fragment
          assert html.count("<table")>=1,"Markdown cast table did not compile to HTML"
          for filename in ("superhero_v3_01_comic_lineup.png","superhero_v3_02_colour_wheels.png","superhero_v3_03_showdowns.png"):
              path=site/"assets/charts/superhero-colour-code"/filename
              assert path.is_file(),path
              assert filename in html,filename
          assert len(re.findall(r"<tr",html))>=13,"Expected 24 characters displayed in twelve table rows"
          assert "Culture" in html
          print("PASS: real Jekyll output contains responsive charts, Culture metadata and the cast table")
          PY
