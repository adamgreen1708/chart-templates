name: Restore Interwoven approved artwork and gallery media
on:
  push:
    branches: [fix/interwoven-missing-release-assets]
    paths:
      - "archive/projects/2026-11-interwoven/recover_media.py"
      - ".github/workflows/interwoven-recover.yml"
permissions:
  contents: write
jobs:
  recover:
    if: github.ref == 'refs/heads/fix/interwoven-missing-release-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-lato fonts-dejavu-core ffmpeg
          python -m pip install Pillow==12.3.0 numpy==2.3.5 scipy==1.17.0 opencv-python-headless==4.13.0.92
      - name: Recreate and validate media
        run: python archive/projects/2026-11-interwoven/recover_media.py
      - name: Commit recovered files to repair branch only
        run: |
          sha256sum -c archive/projects/2026-11-interwoven/RECOVERY_ASSETS.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/gallery/interwoven archive/projects/2026-11-interwoven/RECOVERY_ASSETS.sha256
          git commit -m "Restore Interwoven media from validated data and original camera sequence"
          git push origin HEAD:refs/heads/fix/interwoven-missing-release-assets
