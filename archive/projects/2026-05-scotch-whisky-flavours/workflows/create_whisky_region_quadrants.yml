name: Create whisky region quadrant datasets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandas
        run: pip install pandas

      - name: Generate region quadrant datasets
        run: python src/create_whisky_region_quadrants.py

      - name: Commit generated datasets
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/region_quadrants/*.csv

          git commit -m "Generate whisky region quadrant datasets" || echo "No changes"

          git push